apiVersion: apps/v1
kind: Deployment
metadata:
  name: openerp-backend
  labels:
    app: openerp-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: openerp-backend
  template:
    metadata:
      labels:
        app: openerp-backend
    spec:
      containers:
        - name: backend
          image: openerp-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1024Mi"
          readinessProbe:
            httpGet:
              path: /q/health/ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /q/health/live
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: openerp-backend-svc
spec:
  selector:
    app: openerp-backend
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
