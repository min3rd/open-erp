apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: openerp-ingress
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  rules:
    - host: openerp.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: openerp-backend-svc
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: openerp-web-svc
                port:
                  number: 80
