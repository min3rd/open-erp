apiVersion: apps/v1
kind: Deployment
metadata:
  name: openerp-web
  labels:
    app: openerp-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: openerp-web
  template:
    metadata:
      labels:
        app: openerp-web
    spec:
      containers:
        - name: web
          image: openerp-web:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "300m"
              memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: openerp-web-svc
spec:
  selector:
    app: openerp-web
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
