<div class="py-12 px-4 text-center font-sans">
  @if (loading) {
    <div class="mx-auto w-12 h-12 mb-3">
      <erp-skeleton width="3rem" height="3rem" shape="rounded"></erp-skeleton>
    </div>
    <div class="mx-auto max-w-xs space-y-2">
      <erp-skeleton width="60%" height="1rem" className="mx-auto"></erp-skeleton>
      <erp-skeleton width="80%" height="0.75rem" className="mx-auto"></erp-skeleton>
    </div>
  } @else {
    <div class="mx-auto w-12 h-12 rounded-2xl bg-slate-100 dark:bg-slate-800 flex items-center justify-center text-slate-400 dark:text-slate-500 mb-3 shadow-inner">
      <erp-icon [name]="getIconName()" [size]="24" className="text-slate-400 dark:text-slate-500"></erp-icon>
    </div>
    <h3 class="text-xs font-bold text-slate-800 dark:text-slate-200">{{ title }}</h3>
    @if (description) {
      <p class="mt-1 text-[11px] text-slate-400 max-w-xs mx-auto">{{ description }}</p>
    }
    <div class="mt-4">
      <ng-content select="[action]"></ng-content>
    </div>
  }
</div>
