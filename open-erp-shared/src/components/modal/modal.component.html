@if (visible()) {
  <div (click)="onMaskClick($event)"
       class="modal-mask fixed inset-0 z-50 flex p-4 sm:p-6 overflow-y-auto bg-slate-950/60 backdrop-blur-sm transition-all duration-300 animate-in fade-in"
       [class.items-center]="centered()"
       [class.justify-center]="centered()"
       [class.items-start]="!centered()"
       [class.justify-center]="!centered()"
       role="dialog"
       aria-modal="true">
    
    <!-- Modal Window Box -->
    <div [class]="sizeClasses()"
         class="relative w-full bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-3xl shadow-2xl overflow-hidden flex flex-col transition-all duration-300 transform animate-in zoom-in-95 my-auto">
      
      <!-- Modal Header -->
      @if (title() || closable()) {
        <div class="px-6 py-4 border-b border-slate-100 dark:border-slate-800/80 flex items-center justify-between shrink-0 bg-slate-50/50 dark:bg-slate-950/30">
          <div class="flex items-center gap-3 min-w-0">
            @if (icon()) {
              <div class="w-9 h-9 rounded-xl bg-indigo-50 dark:bg-indigo-950/60 text-indigo-600 dark:text-indigo-400 flex items-center justify-center shrink-0">
                <erp-icon [name]="icon()!" [size]="18"></erp-icon>
              </div>
            }
            <div class="min-w-0">
              @if (title()) {
                <h3 class="text-sm font-bold text-slate-900 dark:text-white truncate">{{ title() }}</h3>
              }
              @if (subtitle()) {
                <p class="text-[11px] text-slate-500 dark:text-slate-400 truncate">{{ subtitle() }}</p>
              }
            </div>
          </div>

          @if (closable()) {
            <button (click)="close()"
                    type="button"
                    class="p-1.5 rounded-xl hover:bg-slate-200/60 dark:hover:bg-slate-800 text-slate-400 hover:text-slate-700 dark:hover:text-white transition-colors cursor-pointer"
                    aria-label="Đóng cửa sổ">
              <erp-icon name="x" [size]="16"></erp-icon>
            </button>
          }
        </div>
      }

      <!-- Modal Body -->
      <div class="p-6 overflow-y-auto max-h-[70vh] text-xs text-slate-600 dark:text-slate-300 leading-relaxed custom-scrollbar flex-1">
        <ng-content></ng-content>
      </div>

      <!-- Modal Footer -->
      @if (showFooter()) {
        <div class="px-6 py-3.5 border-t border-slate-100 dark:border-slate-800/80 bg-slate-50/70 dark:bg-slate-950/40 flex items-center justify-end gap-2.5 shrink-0">
          <ng-content select="[modal-footer]">
            <erp-button variant="secondary" size="sm" (click)="close()">
              {{ cancelText() }}
            </erp-button>
            <erp-button variant="primary" size="sm" [loading]="okLoading()" (click)="handleOk()">
              {{ okText() }}
            </erp-button>
          </ng-content>
        </div>
      }

    </div>
  </div>
}
