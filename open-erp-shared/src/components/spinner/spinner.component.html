<div class="inline-flex items-center gap-2.5 font-sans select-none" [class]="color()">
  
  @if (variant() === 'spin') {
    <svg class="animate-spin" [class]="sizeClass()" fill="none" viewBox="0 0 24 24">
      <circle class="opacity-20" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
      <path class="opacity-85" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
    </svg>
  } @else if (variant() === 'dots') {
    <div class="flex items-center gap-1">
      <span class="rounded-full bg-current animate-bounce [animation-delay:-0.3s]" [class]="dotSizeClass()"></span>
      <span class="rounded-full bg-current animate-bounce [animation-delay:-0.15s]" [class]="dotSizeClass()"></span>
      <span class="rounded-full bg-current animate-bounce" [class]="dotSizeClass()"></span>
    </div>
  } @else if (variant() === 'pulse') {
    <div class="relative flex items-center justify-center" [class]="sizeClass()">
      <span class="absolute inline-flex h-full w-full animate-ping rounded-full bg-current opacity-40"></span>
      <span class="relative inline-flex rounded-full bg-current" [class]="dotSizeClass()"></span>
    </div>
  }

  @if (label()) {
    <span class="text-xs font-semibold text-slate-600 dark:text-slate-300">{{ label() }}</span>
  }
</div>
