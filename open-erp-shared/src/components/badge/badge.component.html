@if (loading) {
  <erp-skeleton width="4rem" height="1.25rem" [shape]="pill ? 'pill' : 'rounded'"></erp-skeleton>
} @else {
  <span [class]="getBadgeClasses()">
    @if (variant === 'dot') {
      <span class="w-1.5 h-1.5 rounded-full" [class]="getDotColor()"></span>
    }
    <ng-content>{{ value }}</ng-content>
  </span>
}
