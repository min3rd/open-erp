<div [class.border]="bordered"
     [class.border-slate-200]="bordered"
     [class.dark:border-slate-800]="bordered"
     [class.rounded-2xl]="bordered"
     class="w-full bg-white dark:bg-slate-900 overflow-hidden select-none">
  
  @if (header) {
    <div class="px-5 py-3.5 bg-slate-50/80 dark:bg-slate-950/60 border-b border-slate-100 dark:border-slate-800 font-bold text-xs text-slate-800 dark:text-white uppercase tracking-wider">
      {{ header }}
    </div>
  }

  <div class="divide-y divide-slate-100 dark:divide-slate-800/80">
    <ng-content></ng-content>
  </div>

  @if (footer) {
    <div class="px-5 py-3 bg-slate-50/50 dark:bg-slate-950/40 border-t border-slate-100 dark:border-slate-800 text-[11px] text-slate-500 dark:text-slate-400">
      {{ footer }}
    </div>
  }
</div>
