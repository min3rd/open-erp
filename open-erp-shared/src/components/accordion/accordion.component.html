<div [class.space-y-3]="!bordered && !ghost"
     [class.divide-y]="bordered"
     [class.divide-slate-100]="bordered"
     [class.dark:divide-slate-800/80]="bordered"
     [class.border]="bordered"
     [class.border-slate-200]="bordered"
     [class.dark:border-slate-800]="bordered"
     [class.rounded-3xl]="bordered"
     [class.overflow-hidden]="bordered"
     class="w-full select-none transition-all">
  
  @for (item of items; track item.id || item.title || $index) {
    <div [class.bg-white]="!ghost"
         [class.dark:bg-slate-900]="!ghost"
         [class.border]="!bordered && !ghost"
         [class.border-slate-200/80]="!bordered && !ghost"
         [class.dark:border-slate-800/80]="!bordered && !ghost"
         [class.rounded-2xl]="!bordered && !ghost"
         [class.shadow-xs]="!bordered && !ghost"
         class="overflow-hidden transition-all">
      
      <!-- Accordion Header Button -->
      <button (click)="toggleItem(item, $index)"
              [disabled]="item.disabled"
              type="button"
              [class.cursor-not-allowed]="item.disabled"
              [class.opacity-50]="item.disabled"
              [class.bg-slate-50/60]="item.expanded && !ghost"
              [class.dark:bg-slate-850/60]="item.expanded && !ghost"
              class="w-full flex items-center justify-between px-5 py-4 text-left transition-colors hover:bg-slate-50 dark:hover:bg-slate-800/50 group">
        
        <div class="flex items-center gap-3.5 min-w-0 flex-1">
          @if (item.icon) {
            <div class="w-8 h-8 rounded-xl bg-indigo-50 dark:bg-indigo-950/50 flex items-center justify-center text-indigo-600 dark:text-indigo-400 shrink-0 group-hover:scale-105 transition-transform">
              <erp-icon [name]="item.icon" [size]="16"></erp-icon>
            </div>
          }
          <div class="min-w-0 flex-1">
            <span class="text-xs font-bold text-slate-900 dark:text-white truncate block group-hover:text-indigo-600 dark:group-hover:text-indigo-400 transition-colors">
              {{ item.title }}
            </span>
            @if (item.subtitle) {
              <span class="text-[11px] text-slate-400 dark:text-slate-500 truncate block mt-0.5">{{ item.subtitle }}</span>
            }
          </div>
        </div>

        <div class="flex items-center gap-2.5 shrink-0 ml-3">
          @if (item.badge) {
            <span [class]="item.badgeColor || 'bg-indigo-100 dark:bg-indigo-900/60 text-indigo-700 dark:text-indigo-300'"
                  class="px-2 py-0.5 rounded-full text-[10px] font-bold">
              {{ item.badge }}
            </span>
          }
          <div [class.rotate-180]="item.expanded"
               class="p-1 rounded-lg text-slate-400 group-hover:text-slate-700 dark:group-hover:text-slate-200 transition-transform duration-200">
            <erp-icon name="chevron-down" [size]="16"></erp-icon>
          </div>
        </div>

      </button>

      <!-- Collapsible Content -->
      @if (item.expanded) {
        <div class="px-5 py-4 border-t border-slate-100 dark:border-slate-800/80 text-xs text-slate-600 dark:text-slate-300 animate-in fade-in slide-in-from-top-1 duration-150">
          @if (item.content) {
            <p class="leading-relaxed">{{ item.content }}</p>
          }
          <ng-content></ng-content>
        </div>
      }

    </div>
  }

</div>
