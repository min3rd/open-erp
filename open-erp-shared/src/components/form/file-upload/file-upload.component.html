<div class="w-full font-sans space-y-2">
  @if (label) {
    <erp-label [text]="label" [required]="required" [loading]="loading"></erp-label>
  }

  @if (loading) {
    <erp-skeleton width="100%" height="8rem" shape="rounded"></erp-skeleton>
  } @else {
    <label (dragover)="onDragOver($event)"
           (dragleave)="onDragLeave()"
           (drop)="onDrop($event)"
           [class.border-indigo-600]="isDragging()"
           [class.bg-indigo-50/50]="isDragging()"
           [class.dark:bg-indigo-950/30]="isDragging()"
           [class.border-slate-300]="!isDragging()"
           [class.dark:border-slate-700]="!isDragging()"
           [class.opacity-50]="disabled"
           [class.cursor-not-allowed]="disabled"
           class="w-full p-6 border-2 border-dashed rounded-3xl bg-white dark:bg-slate-900 flex flex-col items-center justify-center text-center cursor-pointer transition-all hover:border-indigo-500/60 shadow-xs group">
      
      <input type="file"
             [accept]="accept"
             [multiple]="multiple"
             [disabled]="disabled"
             (change)="onFileInput($event)"
             class="hidden"/>

      <div class="w-12 h-12 rounded-2xl bg-indigo-50 dark:bg-indigo-950/60 flex items-center justify-center text-indigo-600 dark:text-indigo-400 mb-3 group-hover:scale-110 transition-transform">
        <erp-icon name="upload-cloud" [size]="24"></erp-icon>
      </div>

      <span class="text-xs font-bold text-slate-800 dark:text-slate-200">
        {{ hint }}
      </span>

      <span class="text-[11px] text-slate-400 mt-1">
        Tối đa {{ maxFileSizeMb }}MB/tệp
      </span>
    </label>

    <!-- Uploaded Files List -->
    @if (files().length > 0) {
      <div class="space-y-2 mt-3">
        @for (file of files(); track file.name + $index) {
          <div class="p-2.5 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 flex items-center justify-between shadow-xs">
            <div class="flex items-center gap-3 min-w-0 pr-2">
              @if (file.url) {
                <img [src]="file.url" [alt]="file.name" class="w-9 h-9 rounded-xl object-cover border border-slate-200 dark:border-slate-700 shrink-0"/>
              } @else {
                <div class="w-9 h-9 rounded-xl bg-slate-100 dark:bg-slate-800 flex items-center justify-center text-slate-500 shrink-0">
                  <erp-icon name="file-text" [size]="18"></erp-icon>
                </div>
              }

              <div class="flex flex-col truncate">
                <span class="text-xs font-bold text-slate-800 dark:text-slate-200 truncate">{{ file.name }}</span>
                <span class="text-[10px] text-slate-400">{{ formatFileSize(file.size) }}</span>
              </div>
            </div>

            @if (!disabled) {
              <button type="button" (click)="removeFile($index, $event)" class="text-slate-400 hover:text-rose-500 p-1 rounded-lg transition-colors cursor-pointer shrink-0">
                <erp-icon name="trash-2" [size]="14"></erp-icon>
              </button>
            }
          </div>
        }
      </div>
    }

    @if (errorMessage) {
      <erp-helper-text [text]="errorMessage" status="invalid"></erp-helper-text>
    } @else if (helperText) {
      <erp-helper-text [text]="helperText"></erp-helper-text>
    }
  }
</div>
