<div class="w-full font-sans">
  @if (label) {
    <erp-label [text]="label" [required]="required" [loading]="loading"></erp-label>
  }

  @if (loading) {
    <erp-skeleton width="100%" [height]="size === 'lg' ? '2.875rem' : (size === 'sm' ? '2rem' : '2.5rem')" shape="rounded"></erp-skeleton>
  } @else {
    <div class="relative flex items-center">
      <span class="absolute left-3 text-slate-400 pointer-events-none flex items-center">
        <erp-icon name="lock" [size]="size === 'sm' ? 14 : 16"></erp-icon>
      </span>

      <input [type]="showPassword() ? 'text' : 'password'"
             [value]="value()"
             [placeholder]="placeholder"
             [disabled]="disabled"
             (input)="onInput($event)"
             (blur)="onTouched()"
             [class]="getSizeClasses() + ' ' + getStatusClasses()"
             [class.opacity-50]="disabled"
             [class.cursor-not-allowed]="disabled"
             class="w-full bg-white dark:bg-slate-900 border pl-9 pr-10 outline-none font-medium placeholder-slate-400 transition-all focus:ring-2"/>

      <button type="button" 
              (click)="togglePasswordVisibility()" 
              [disabled]="disabled"
              class="absolute right-3 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 cursor-pointer p-1 rounded-lg transition-colors flex items-center">
        <erp-icon [name]="showPassword() ? 'eye-off' : 'eye'" [size]="16"></erp-icon>
      </button>
    </div>

    @if (showStrengthMeter && value()) {
      <div class="mt-2 space-y-1">
        <div class="flex items-center justify-between text-[10px] font-bold">
          <span class="text-slate-400">Độ mạnh mật khẩu:</span>
          <span [class.text-rose-500]="passwordStrength() <= 25"
                [class.text-amber-500]="passwordStrength() > 25 && passwordStrength() <= 50"
                [class.text-indigo-500]="passwordStrength() > 50 && passwordStrength() <= 75"
                [class.text-emerald-500]="passwordStrength() > 75">
            {{ strengthLabel() }}
          </span>
        </div>
        <div class="w-full h-1.5 bg-slate-100 dark:bg-slate-800 rounded-full overflow-hidden">
          <div class="h-full transition-all duration-300 rounded-full" 
               [class]="strengthColor()" 
               [style.width.%]="passwordStrength()">
          </div>
        </div>
      </div>
    }

    @if (errorMessage) {
      <erp-helper-text [text]="errorMessage" status="invalid"></erp-helper-text>
    } @else if (helperText) {
      <erp-helper-text [text]="helperText" [status]="status"></erp-helper-text>
    }
  }
</div>
