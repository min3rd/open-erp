@if (loading) {
  <div class="flex items-center gap-2.5 py-1">
    <erp-skeleton width="2.5rem" height="1.375rem" shape="pill"></erp-skeleton>
    <erp-skeleton width="6rem" height="0.875rem" shape="rounded"></erp-skeleton>
  </div>
} @else {
  <label (click)="toggle()"
         [class.opacity-50]="disabled"
         [class.cursor-not-allowed]="disabled"
         class="inline-flex items-center gap-3 cursor-pointer select-none font-sans group">
    
    <div [class.bg-indigo-600]="checked()"
         [class.bg-slate-200]="!checked()"
         [class.dark:bg-slate-700]="!checked()"
         [class.w-8]="size === 'sm'"
         [class.h-4]="size === 'sm'"
         [class.w-11]="size === 'md'"
         [class.h-6]="size === 'md'"
         [class.w-14]="size === 'lg'"
         [class.h-7]="size === 'lg'"
         class="relative rounded-full transition-colors duration-200 ease-in-out shrink-0 p-0.5">
      
      <span [class.translate-x-4]="checked() && size === 'sm'"
            [class.translate-x-5]="checked() && size === 'md'"
            [class.translate-x-7]="checked() && size === 'lg'"
            [class.translate-x-0]="!checked()"
            [class.w-3]="size === 'sm'"
            [class.h-3]="size === 'sm'"
            [class.w-5]="size === 'md'"
            [class.h-5]="size === 'md'"
            [class.w-6]="size === 'lg'"
            [class.h-6]="size === 'lg'"
            class="block rounded-full bg-white shadow-md transform transition-transform duration-200 ease-in-out">
      </span>
    </div>

    @if (label || description) {
      <div class="flex flex-col">
        @if (label) {
          <span class="text-xs font-bold text-slate-800 dark:text-slate-200">{{ label }}</span>
        }
        @if (description) {
          <span class="text-[11px] text-slate-400">{{ description }}</span>
        }
      </div>
    }
  </label>
}
