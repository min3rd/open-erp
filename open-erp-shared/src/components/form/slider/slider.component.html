<div class="w-full font-sans space-y-1.5">
  <div class="flex items-center justify-between">
    @if (label()) {
      <erp-label [text]="label()!" [loading]="loading()"></erp-label>
    }

    @if (showValue() && !loading()) {
      <span class="text-xs font-bold text-indigo-600 dark:text-indigo-400 bg-indigo-50 dark:bg-indigo-950/70 px-2 py-0.5 rounded-md border border-indigo-200/60 dark:border-indigo-800/60">
        {{ value() }} {{ unit() || '' }}
      </span>
    }
  </div>

  @if (loading()) {
    <erp-skeleton width="100%" height="1.25rem" shape="pill"></erp-skeleton>
  } @else {
    <div class="relative py-2">
      <input type="range"
             [min]="min()"
             [max]="max()"
             [step]="step()"
             [value]="value()"
             [disabled]="effectiveDisabled()"
             (input)="onSliderInput($event)"
             (blur)="onTouched()"
             [class.opacity-50]="effectiveDisabled()"
             [class.cursor-not-allowed]="effectiveDisabled()"
             class="w-full h-2 bg-slate-200 dark:bg-slate-700 rounded-lg appearance-none cursor-pointer accent-indigo-600 focus:outline-none"/>
      
      <div class="flex items-center justify-between text-[10px] text-slate-400 font-semibold px-0.5 mt-1">
        <span>{{ min() }} {{ unit() || '' }}</span>
        <span>{{ max() }} {{ unit() || '' }}</span>
      </div>
    </div>

    @if (helperText()) {
      <erp-helper-text [text]="helperText()!"></erp-helper-text>
    }
  }
</div>
