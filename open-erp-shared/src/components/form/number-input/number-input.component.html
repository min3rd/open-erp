<div class="w-full font-sans">
  @if (label()) {
    <erp-label [text]="label()!" [required]="required()" [loading]="loading()"></erp-label>
  }

  @if (loading()) {
    <erp-skeleton width="100%" [height]="skeletonHeight()" shape="rounded"></erp-skeleton>
  } @else {
    <div class="relative flex items-center">
      @if (prefix()) {
        <span class="absolute left-3 text-slate-400 font-semibold text-xs pointer-events-none select-none">
          {{ prefix() }}
        </span>
      }

      <input type="number"
             [value]="value() !== null ? value() : ''"
             [placeholder]="placeholder()"
             [min]="min()"
             [max]="max()"
             [step]="step()"
             [disabled]="effectiveDisabled()"
             (input)="onInputChange($event)"
             (blur)="onTouched()"
             [class]="sizeClass() + ' ' + statusClass()"
             [class.pl-8]="prefix()"
             [class.pr-20]="!suffix()"
             [class.pr-28]="suffix()"
             [class.opacity-50]="effectiveDisabled()"
             [class.cursor-not-allowed]="effectiveDisabled()"
             class="w-full bg-white dark:bg-slate-900 border outline-none font-medium placeholder-slate-400 transition-all focus:ring-2 [appearance:textfield] [&::-webkit-outer-spin-button]:appearance-none [&::-webkit-inner-spin-button]:appearance-none"/>

      <div class="absolute right-2 flex items-center gap-1">
        @if (suffix()) {
          <span class="text-slate-400 font-semibold text-xs select-none pr-1">
            {{ suffix() }}
          </span>
        }

        <button type="button" 
                (click)="decrement()"
                [disabled]="effectiveDisabled() || (value() !== null && value()! <= min())"
                aria-label="Giảm giá trị"
                class="w-6 h-6 rounded-lg bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-600 dark:text-slate-300 flex items-center justify-center transition-colors cursor-pointer disabled:opacity-40 disabled:cursor-not-allowed">
          -
        </button>

        <button type="button" 
                (click)="increment()"
                [disabled]="effectiveDisabled() || (value() !== null && value()! >= max())"
                aria-label="Tăng giá trị"
                class="w-6 h-6 rounded-lg bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-600 dark:text-slate-300 flex items-center justify-center transition-colors cursor-pointer disabled:opacity-40 disabled:cursor-not-allowed">
          +
        </button>
      </div>
    </div>

    @if (errorMessage()) {
      <erp-helper-text [text]="errorMessage()!" status="invalid"></erp-helper-text>
    } @else if (helperText()) {
      <erp-helper-text [text]="helperText()!" [status]="status()"></erp-helper-text>
    }
  }
</div>
