<div class="w-full font-sans space-y-2">
  @if (label()) {
    <erp-label [text]="label()!" [loading]="loading()"></erp-label>
  }

  @if (loading()) {
    <erp-skeleton width="100%" height="2.5rem" shape="rounded"></erp-skeleton>
  } @else {
    <div class="flex flex-wrap items-center gap-3">
      
      <!-- Native Color Input + Hex Text -->
      <div class="flex items-center gap-2 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl p-1.5 shadow-xs">
        <input type="color"
               [value]="color()"
               [disabled]="effectiveDisabled()"
               (input)="onColorChange($any($event.target).value)"
               aria-label="Chọn màu sắc"
               class="w-7 h-7 rounded-lg border-0 cursor-pointer p-0 bg-transparent"/>

        <input type="text"
               [value]="color()"
               [disabled]="effectiveDisabled()"
               (input)="onColorChange($any($event.target).value)"
               aria-label="Mã màu HEX"
               class="w-20 text-xs font-mono font-bold text-slate-800 dark:text-slate-200 bg-transparent outline-none uppercase"/>
      </div>

      <!-- Presets Swatches -->
      <div class="flex flex-wrap items-center gap-1.5">
        @for (c of presets(); track c) {
          <button type="button"
                  (click)="onColorChange(c)"
                  [disabled]="effectiveDisabled()"
                  [style.background-color]="c"
                  [attr.aria-label]="'Màu ' + c"
                  [class.ring-2]="color().toLowerCase() === c.toLowerCase()"
                  [class.ring-offset-2]="color().toLowerCase() === c.toLowerCase()"
                  [class.ring-indigo-600]="color().toLowerCase() === c.toLowerCase()"
                  class="w-6 h-6 rounded-lg shadow-xs transition-transform hover:scale-110 cursor-pointer disabled:opacity-40">
          </button>
        }
      </div>

    </div>

    @if (helperText()) {
      <erp-helper-text [text]="helperText()!"></erp-helper-text>
    }
  }
</div>
