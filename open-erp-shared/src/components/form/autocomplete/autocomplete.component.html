<div class="w-full font-sans relative">
  @if (label()) {
    <erp-label [text]="label()!" [required]="required()" [loading]="loading()"></erp-label>
  }

  @if (loading()) {
    <erp-skeleton width="100%" height="2.5rem" shape="rounded"></erp-skeleton>
  } @else {
    <div class="relative flex items-center">
      <span class="absolute left-3 text-slate-400 pointer-events-none flex items-center">
        <erp-icon name="search" [size]="16"></erp-icon>
      </span>

      <input type="text"
             [value]="query()"
             [placeholder]="placeholder()"
             [disabled]="effectiveDisabled()"
             (input)="onInput($event)"
             (focus)="query().length >= minLength() && isOpen.set(true)"
             (blur)="onTouched()"
             [class.border-rose-500]="errorMessage() || status() === 'invalid'"
             [class.border-slate-200]="!errorMessage() && status() !== 'invalid'"
             [class.dark:border-slate-700]="!errorMessage() && status() !== 'invalid'"
             [class.opacity-50]="effectiveDisabled()"
             [class.cursor-not-allowed]="effectiveDisabled()"
             class="w-full bg-white dark:bg-slate-900 border pl-9 pr-9 py-2.5 text-xs rounded-xl outline-none font-medium placeholder-slate-400 transition-all focus:ring-2 focus:ring-indigo-500/20 text-slate-900 dark:text-white"/>

      @if (query() && !effectiveDisabled()) {
        <button type="button" (click)="clear()" aria-label="Xóa tìm kiếm" class="absolute right-3 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 p-0.5 rounded-full">
          <erp-icon name="x" [size]="14"></erp-icon>
        </button>
      }
    </div>

    <!-- Autocomplete Suggestions Popover -->
    @if (isOpen() && filteredItems().length > 0) {
      <div class="absolute z-50 mt-1.5 w-full bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl shadow-xl p-1 max-h-56 overflow-y-auto space-y-0.5 animate-in fade-in zoom-in-95 duration-100">
        @for (it of filteredItems(); track it.value) {
          <button type="button"
                  (click)="selectItem(it)"
                  class="w-full text-left px-3 py-2 rounded-xl text-xs flex items-center justify-between text-slate-700 dark:text-slate-200 hover:bg-indigo-50 dark:hover:bg-indigo-950/60 hover:text-indigo-600 dark:hover:text-indigo-400 transition-colors cursor-pointer">
            <div class="flex items-center gap-2">
              @if (it.icon) {
                <erp-icon [name]="it.icon" [size]="14"></erp-icon>
              }
              <span class="font-semibold">{{ it.label }}</span>
            </div>
            @if (it.category) {
              <span class="text-[10px] text-slate-400 font-mono">{{ it.category }}</span>
            }
          </button>
        }
      </div>
    }

    @if (errorMessage()) {
      <erp-helper-text [text]="errorMessage()!" status="invalid"></erp-helper-text>
    } @else if (helperText()) {
      <erp-helper-text [text]="helperText()!" [status]="status()"></erp-helper-text>
    }
  }
</div>
