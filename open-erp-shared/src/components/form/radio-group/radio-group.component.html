<div class="w-full font-sans">
  @if (label) {
    <erp-label [text]="label" [required]="required" [loading]="loading"></erp-label>
  }

  @if (loading) {
    <div class="space-y-2">
      <erp-skeleton width="100%" height="2rem" shape="rounded"></erp-skeleton>
      <erp-skeleton width="100%" height="2rem" shape="rounded"></erp-skeleton>
    </div>
  } @else {
    <div [class.flex-col]="orientation === 'vertical' && !cardMode"
         [class.flex-row]="orientation === 'horizontal' && !cardMode"
         [class.grid]="cardMode"
         [class.grid-cols-1]="cardMode && orientation === 'vertical'"
         [class.grid-cols-2]="cardMode && orientation === 'horizontal'"
         [class.sm:grid-cols-3]="cardMode && orientation === 'horizontal'"
         class="flex gap-2.5">
      
      @for (opt of options; track opt.value) {
        <div (click)="selectOption(opt)"
             [class.border-indigo-600]="cardMode && selectedValue() === opt.value"
             [class.dark:border-indigo-500]="cardMode && selectedValue() === opt.value"
             [class.bg-indigo-50/50]="cardMode && selectedValue() === opt.value"
             [class.dark:bg-indigo-950/40]="cardMode && selectedValue() === opt.value"
             [class.border-slate-200]="cardMode && selectedValue() !== opt.value"
             [class.dark:border-slate-700]="cardMode && selectedValue() !== opt.value"
             [class.bg-white]="cardMode && selectedValue() !== opt.value"
             [class.dark:bg-slate-900]="cardMode && selectedValue() !== opt.value"
             [class.p-3.5]="cardMode"
             [class.rounded-2xl]="cardMode"
             [class.border]="cardMode"
             [class.shadow-xs]="cardMode"
             [class.opacity-50]="disabled || opt.disabled"
             [class.cursor-not-allowed]="disabled || opt.disabled"
             class="inline-flex items-start gap-2.5 cursor-pointer select-none transition-all group">
          
          <div [class.border-indigo-600]="selectedValue() === opt.value"
               [class.border-slate-300]="selectedValue() !== opt.value"
               [class.dark:border-slate-600]="selectedValue() !== opt.value"
               class="w-4 h-4 mt-0.5 rounded-full border flex items-center justify-center transition-all group-hover:border-indigo-500 shrink-0">
            @if (selectedValue() === opt.value) {
              <span class="w-2 h-2 rounded-full bg-indigo-600 animate-in zoom-in duration-100"></span>
            }
          </div>

          <div class="flex flex-col">
            <div class="flex items-center gap-1.5">
              @if (opt.icon) {
                <erp-icon [name]="opt.icon" [size]="14" className="text-indigo-600 dark:text-indigo-400"></erp-icon>
              }
              <span class="text-xs font-bold text-slate-800 dark:text-slate-200">{{ opt.label }}</span>
            </div>

            @if (opt.description) {
              <span class="text-[11px] text-slate-400 mt-0.5">{{ opt.description }}</span>
            }
          </div>
        </div>
      }
    </div>

    @if (errorMessage) {
      <erp-helper-text [text]="errorMessage" status="invalid"></erp-helper-text>
    } @else if (helperText) {
      <erp-helper-text [text]="helperText"></erp-helper-text>
    }
  }
</div>
