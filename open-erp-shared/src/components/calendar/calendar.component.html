<div [class.border]="bordered()"
     [class.border-slate-200]="bordered()"
     [class.dark:border-slate-800]="bordered()"
     [class.rounded-3xl]="bordered()"
     class="w-full bg-white dark:bg-slate-900 p-5 overflow-hidden select-none shadow-sm">
  
  <!-- Header: Month Title & Navigation -->
  <div class="flex items-center justify-between mb-4">
    <div class="flex items-center gap-2">
      <h3 class="font-bold text-sm text-slate-900 dark:text-white">{{ monthLabel() }}</h3>
      <button (click)="goToToday()"
              type="button"
              class="px-2 py-0.5 rounded-lg text-[10px] font-bold bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-700 transition-colors">
        Hôm nay
      </button>
    </div>

    <div class="flex items-center gap-1">
      <button (click)="prevMonth()"
              type="button"
              title="Tháng trước"
              aria-label="Tháng trước"
              class="p-1.5 rounded-xl border border-slate-200 dark:border-slate-700 hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-600 dark:text-slate-300 transition-colors">
        <erp-icon name="chevron-left" [size]="14"></erp-icon>
      </button>
      <button (click)="nextMonth()"
              type="button"
              title="Tháng sau"
              aria-label="Tháng sau"
              class="p-1.5 rounded-xl border border-slate-200 dark:border-slate-700 hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-600 dark:text-slate-300 transition-colors">
        <erp-icon name="chevron-right" [size]="14"></erp-icon>
      </button>
    </div>
  </div>

  <!-- Day-of-Week Headers -->
  <div class="grid grid-cols-7 gap-1 text-center font-bold text-[11px] text-slate-400 dark:text-slate-500 uppercase tracking-wider mb-2">
    @for (wd of weekDays; track wd) {
      <div class="py-1">{{ wd }}</div>
    }
  </div>

  <!-- Calendar Day Grid Cells -->
  <div class="grid grid-cols-7 gap-1">
    @for (day of daysMatrix(); track day.dateStr + $index) {
      <button (click)="onSelectDay(day)"
              type="button"
              [attr.aria-label]="day.dateStr"
              [class.opacity-30]="!day.isCurrentMonth"
              [class.bg-indigo-600]="day.isSelected"
              [class.text-white]="day.isSelected"
              [class.font-bold]="day.isSelected || day.isToday"
              [class.ring-2]="day.isToday && !day.isSelected"
              [class.ring-indigo-500/40]="day.isToday && !day.isSelected"
              [class.text-indigo-600]="day.isToday && !day.isSelected"
              [class.dark:text-indigo-400]="day.isToday && !day.isSelected"
              [class.hover:bg-slate-100]="!day.isSelected"
              [class.dark:hover:bg-slate-800]="!day.isSelected"
              [class.text-slate-800]="!day.isSelected && day.isCurrentMonth"
              [class.dark:text-slate-200]="!day.isSelected && day.isCurrentMonth"
              class="min-h-[44px] sm:min-h-[52px] p-1.5 rounded-2xl flex flex-col items-center justify-between transition-all relative group">
        
        <span class="text-xs">{{ day.day }}</span>

        <!-- Event Indicator Dots -->
        @if (day.events.length > 0) {
          <div class="flex items-center gap-0.5">
            @for (ev of day.events.slice(0, 3); track ev.title + $index) {
              <span [class]="day.isSelected ? 'bg-white' : (ev.color || 'bg-indigo-600 dark:bg-indigo-400')"
                    class="w-1.5 h-1.5 rounded-full inline-block">
              </span>
            }
          </div>
        }
      </button>
    }
  </div>

</div>
