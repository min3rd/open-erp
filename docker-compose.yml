services:
  # ============================================================================
  # 1. PostgreSQL - Primary / Master (TỐI THIỂU - Mặc định luôn chạy)
  # ============================================================================
  postgres-primary:
    image: postgres:16-alpine
    container_name: openerp-postgres-primary
    environment:
      POSTGRES_USER: openerp
      POSTGRES_PASSWORD: openerp_dev_password
      POSTGRES_DB: openerp_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_primary_data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openerp -d openerp_dev"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - openerp-net

  # ============================================================================
  # 2. Redis - Distributed Cache, Session & Locks (TỐI THIỂU - Mặc định luôn chạy)
  # ============================================================================
  redis:
    image: redis:7.2-alpine
    container_name: openerp-redis
    command: ["redis-server", "--requirepass", "openerp_redis_password"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    deploy:
      resources:
        limits:
          memory: 256M
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "openerp_redis_password", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - openerp-net

  # ============================================================================
  # 3. PostgreSQL - Read-Replica / Slave (ON-DEMAND: profiles: ["full", "replica"])
  # ============================================================================
  postgres-replica:
    image: postgres:16-alpine
    container_name: openerp-postgres-replica
    profiles: ["full", "replica"]
    environment:
      POSTGRES_USER: openerp
      POSTGRES_PASSWORD: openerp_dev_password
      POSTGRES_DB: openerp_dev
    ports:
      - "5433:5432"
    deploy:
      resources:
        limits:
          memory: 512M
    depends_on:
      postgres-primary:
        condition: service_healthy
    networks:
      - openerp-net

  # ============================================================================
  # 4. MongoDB - Replica-Set (ON-DEMAND: profiles: ["full", "mongo"])
  # ============================================================================
  mongodb:
    image: mongo:7.0
    container_name: openerp-mongodb
    profiles: ["full", "mongo"]
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - openerp-net

  # ============================================================================
  # 5. Apache Kafka - KRaft Mode (ON-DEMAND: profiles: ["full", "kafka"])
  # ============================================================================
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: openerp-kafka
    profiles: ["full", "kafka"]
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092,CONTROLLER://0.0.0.0:29093'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
      KAFKA_JVM_PERFORMANCE_OPTS: '-Xms256m -Xmx512m'
    deploy:
      resources:
        limits:
          memory: 768M
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - openerp-net

  # ============================================================================
  # 6. Kafka UI - Dashboard Quản Lý (ON-DEMAND: profiles: ["full", "kafka"])
  # ============================================================================
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: openerp-kafka-ui
    profiles: ["full", "kafka"]
    ports:
      - "8085:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local-dev-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      JAVA_OPTS: '-Xms128m -Xmx256m'
    deploy:
      resources:
        limits:
          memory: 384M
    depends_on:
      - kafka
    networks:
      - openerp-net

  # ============================================================================
  # 7. MinIO - S3 Object Storage (ON-DEMAND: profiles: ["full", "storage"])
  # ============================================================================
  minio:
    image: minio/minio:latest
    container_name: openerp-minio
    profiles: ["full", "storage"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: openerp_minio_admin
      MINIO_ROOT_PASSWORD: openerp_minio_password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - openerp-net

  # ============================================================================
  # 8. Mailpit - SMTP Testing Server (ON-DEMAND: profiles: ["full", "mail"])
  # ============================================================================
  mailpit:
    image: axllent/mailpit:latest
    container_name: openerp-mailpit
    profiles: ["full", "mail"]
    ports:
      - "1025:1025" # SMTP port
      - "8025:8025" # Web UI
    deploy:
      resources:
        limits:
          memory: 128M
    networks:
      - openerp-net

networks:
  openerp-net:
    driver: bridge

volumes:
  postgres_primary_data:
  mongodb_data:
  redis_data:
  kafka_data:
  minio_data:
