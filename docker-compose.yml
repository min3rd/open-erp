services:
  # ============================================================================
  # 1. PostgreSQL - Primary / Master (TỐI THIỂU - Mặc định luôn chạy)
  # ============================================================================
  postgres-primary:
    image: postgres:16-alpine
    container_name: openerp-postgres-primary
    environment:
      POSTGRES_USER: openerp
      POSTGRES_PASSWORD: openerp_dev_password
      POSTGRES_DB: openerp_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_primary_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openerp -d openerp_dev"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - openerp-net

  # ============================================================================
  # 2. Redis - Distributed Cache, Session & Locks (TỐI THIỂU - Mặc định luôn chạy)
  # ============================================================================
  redis:
    image: redis:7.2-alpine
    container_name: openerp-redis
    command: ["redis-server", "--requirepass", "openerp_redis_password"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    deploy:
      resources:
        limits:
          memory: 256M
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "openerp_redis_password", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - openerp-net

  # ============================================================================
  # 3. PostgreSQL - Read-Replica / Slave (ON-DEMAND: profiles: ["full", "replica"])
  # ============================================================================
  postgres-replica:
    image: postgres:16-alpine
    container_name: openerp-postgres-replica
    profiles: ["full", "replica"]
    environment:
      POSTGRES_USER: openerp
      POSTGRES_PASSWORD: openerp_dev_password
      POSTGRES_DB: openerp_dev
    ports:
      - "5433:5432"
    deploy:
      resources:
        limits:
          memory: 512M
    depends_on:
      postgres-primary:
        condition: service_healthy
    networks:
      - openerp-net

  # ============================================================================
  # 4. MongoDB - Replica-Set (ON-DEMAND: profiles: ["full", "mongo"])
  # ============================================================================
  mongodb:
    image: mongo:7.0
    container_name: openerp-mongodb
    profiles: ["full", "mongo"]
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - openerp-net

  # ============================================================================
  # 5. Apache Kafka - KRaft Mode (ON-DEMAND: profiles: ["full", "kafka"])
  # ============================================================================
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: openerp-kafka
    profiles: ["full", "kafka"]
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092,CONTROLLER://0.0.0.0:29093'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
      KAFKA_JVM_PERFORMANCE_OPTS: '-Xms256m -Xmx512m'
    deploy:
      resources:
        limits:
          memory: 768M
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - openerp-net

  # ============================================================================
  # 6. Kafka UI - Dashboard Quản Lý (ON-DEMAND: profiles: ["full", "kafka"])
  # ============================================================================
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: openerp-kafka-ui
    profiles: ["full", "kafka"]
    ports:
      - "8085:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local-dev-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      JAVA_OPTS: '-Xms128m -Xmx256m'
    deploy:
      resources:
        limits:
          memory: 384M
    depends_on:
      - kafka
    networks:
      - openerp-net

  # ============================================================================
  # 7. MinIO - S3 Object Storage (ON-DEMAND: profiles: ["full", "storage"])
  # ============================================================================
  minio:
    # MinIO da ngung phat hanh image tren Docker Hub (minio/minio 404); dung mirror pgsty/minio.
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    container_name: openerp-minio
    profiles: ["full", "storage"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: openerp_minio_admin
      MINIO_ROOT_PASSWORD: openerp_minio_password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - openerp-net

  # ============================================================================
  # 8. Mailpit - SMTP Testing Server (ON-DEMAND: profiles: ["full", "mail"])
  # ============================================================================
  mailpit:
    image: axllent/mailpit:latest
    container_name: openerp-mailpit
    profiles: ["full", "mail"]
    ports:
      - "1025:1025" # SMTP port
      - "8025:8025" # Web UI
    deploy:
      resources:
        limits:
          memory: 128M
    networks:
      - openerp-net

  # ============================================================================
  # 9. Registry v2 - local OCI/Docker image registry (ON-DEMAND: profiles: ["full", "registry"])
  # ============================================================================
  registry:
    image: registry:2
    container_name: openerp-registry
    profiles: ["full", "registry"]
    ports:
      - "5001:5000"
    environment:
      REGISTRY_STORAGE_DELETE_ENABLED: "true"
    volumes:
      - registry_data:/var/lib/registry
    deploy:
      resources:
        limits:
          memory: 128M
    networks:
      - openerp-net

  # ============================================================================
  # 5. Core backend + catalog plugin image (DEV: profiles: ["dev"])
  #    Backend mounts the host Docker socket so the plugin deployer can spawn
  #    one catalog container per tenant on openerp-net.
  # ============================================================================
  plugin-certs:
    image: eclipse-temurin:21-jdk-alpine
    container_name: openerp-plugin-certs
    profiles: ["dev", "test"]
    volumes:
      - plugin_certs:/certs
      - ./docker/certs/generate.sh:/gen.sh:ro
    entrypoint: ["sh", "-c", "apk add --no-cache openssl >/dev/null && sh /gen.sh"]
    networks:
      - openerp-net

  backend-dev:
    build:
      context: ./src/backend
      dockerfile: Dockerfile
    image: open-erp/backend:dev
    container_name: openerp-backend-dev
    profiles: ["dev"]
    environment:
      QUARKUS_PROFILE: dev
      QUARKUS_HTTP_PORT: "8080"
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres-primary:5432/openerp_dev
      QUARKUS_DATASOURCE_USERNAME: openerp
      QUARKUS_DATASOURCE_PASSWORD: openerp_dev_password
      QUARKUS_REDIS_HOSTS: redis://:openerp_redis_password@redis:6379
      OPENERP_PLUGIN_DEPLOYER_RUNTIME: docker
      OPENERP_PLUGIN_RUNTIME_NETWORK: openerp-net
      OPENERP_PLUGIN_MIGRATIONS_DIR: /deploy/plugin-migrations
      OPENERP_PLUGIN_FANOUT_TOKEN: dev-fanout-token
      OPENERP_FRONTEND_URL: http://localhost:4200
      QUARKUS_GRPC_SERVER_SSL_CERTIFICATE: /deploy/certs/server.crt
      QUARKUS_GRPC_SERVER_SSL_KEY: /deploy/certs/server.key
      QUARKUS_GRPC_SERVER_SSL_TRUST_STORE: /deploy/certs/truststore.jks
      QUARKUS_GRPC_SERVER_SSL_TRUST_STORE_PASSWORD: changeit
      QUARKUS_GRPC_SERVER_SSL_CLIENT_AUTH: REQUIRED
      OPENERP_PLUGIN_RUNTIME_GATEWAY_URL: https://backend-dev:9090
      OPENERP_PLUGIN_RUNTIME_TLS_DIR: /deploy/certs
      OPENERP_PLUGIN_DEPLOYER_TLS_HOST_DIR: openerp_plugin_certs
      # Local dev registry used by the plugin image builder; private hosts are
      # rejected unless explicitly allowlisted.
      OPENERP_PLUGIN_REGISTRY_ALLOWED_HOSTS: openerp-registry.local
      OPENERP_PLUGIN_OCI_RESOLVE_DIGEST: "false"
    ports:
      - "8088:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./plugins/catalog/migrations:/deploy/plugin-migrations/catalog:ro
      - plugin_certs:/deploy/certs:ro
    # The socket is root:root 0660 on Docker Desktop; grant the dev user the
    # socket group so the deployer can spawn per-tenant plugin containers.
    group_add:
      - "0"
    depends_on:
      postgres-primary:
        condition: service_healthy
      redis:
        condition: service_healthy
      plugin-certs:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          memory: 1024M
    networks:
      - openerp-net

  catalog-plugin-dev:
    build:
      context: .
      dockerfile: plugins/catalog/deploy/Dockerfile
    image: open-erp/catalog:1.0.9
    container_name: openerp-catalog-dev
    profiles: ["test"]
    environment:
      TENANT_ID: cd2729d8-aec0-423c-b2b0-2649a97d822f
      PLUGIN_SCOPE: tenant
      PLUGIN_FANOUT_TOKEN: dev-fanout-token
      PLUGIN_KEY: catalog
      PLUGIN_DATA_GATEWAY_URL: https://backend-dev:9090
      PLUGIN_DATA_TLS_CA: /deploy/certs/ca.crt
      PLUGIN_DATA_TLS_CERT: /deploy/certs/tenant-client.crt
      PLUGIN_DATA_TLS_KEY: /deploy/certs/tenant-client.key
      PLUGIN_DATA_DEADLINE_MS: "15000"
      QUARKUS_REDIS_HOSTS: redis://:openerp_redis_password@redis:6379
      QUARKUS_HTTP_PORT: "8080"
    ports:
      - "18082:8080"
    volumes:
      - plugin_certs:/deploy/certs:ro
    depends_on:
      redis:
        condition: service_healthy
      plugin-certs:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - openerp-net

  catalog-system-dev:
    image: open-erp/catalog:1.0.9
    container_name: openerp-catalog-system-dev
    profiles: ["dev"]
    environment:
      TENANT_ID: 00000000-0000-0000-0000-000000000001
      PLUGIN_SCOPE: platform
      PLUGIN_FANOUT_TOKEN: dev-fanout-token
      PLUGIN_KEY: catalog
      PLUGIN_DATA_GATEWAY_URL: https://backend-dev:9090
      PLUGIN_DATA_TLS_CA: /deploy/certs/ca.crt
      PLUGIN_DATA_TLS_CERT: /deploy/certs/system-client.crt
      PLUGIN_DATA_TLS_KEY: /deploy/certs/system-client.key
      PLUGIN_DATA_DEADLINE_MS: "15000"
      QUARKUS_REDIS_HOSTS: redis://:openerp_redis_password@redis:6379
      QUARKUS_HTTP_PORT: "8080"
    ports:
      - "18083:8080"
    volumes:
      - plugin_certs:/deploy/certs:ro
    depends_on:
      redis:
        condition: service_healthy
      plugin-certs:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - openerp-net

  catalog-e2e-dev:
    image: open-erp/catalog:1.0.9
    container_name: openerp-catalog-e2e-dev
    profiles: ["test"]
    environment:
      TENANT_ID: aafea2fa-953d-410a-a9d7-6489106f5c8d
      PLUGIN_SCOPE: tenant
      PLUGIN_FANOUT_TOKEN: dev-fanout-token
      PLUGIN_KEY: catalog
      PLUGIN_DATA_GATEWAY_URL: https://backend-dev:9090
      PLUGIN_DATA_TLS_CA: /deploy/certs/ca.crt
      PLUGIN_DATA_TLS_CERT: /deploy/certs/tenant-client.crt
      PLUGIN_DATA_TLS_KEY: /deploy/certs/tenant-client.key
      PLUGIN_DATA_DEADLINE_MS: "15000"
      QUARKUS_REDIS_HOSTS: redis://:openerp_redis_password@redis:6379
      QUARKUS_HTTP_PORT: "8080"
    ports:
      - "18084:8080"
    volumes:
      - plugin_certs:/deploy/certs:ro
    depends_on:
      redis:
        condition: service_healthy
      plugin-certs:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - openerp-net

  web-dev:
    build:
      context: .
      dockerfile: docker/web/Dockerfile.dev
    image: open-erp/web:dev
    container_name: openerp-web-dev
    profiles: ["dev"]
    environment:
      NG_CLI_ANALYTICS: "false"
    ports:
      - "4200:4200"
    volumes:
      - ./src/frontend/web:/app/src/frontend/web
      - ./src/frontend/shared:/app/src/frontend/shared
      - web_node_modules:/app/src/frontend/web/node_modules
      - web_angular_cache:/app/src/frontend/web/.angular
    depends_on:
      - backend-dev
    deploy:
      resources:
        limits:
          memory: 1024M
    networks:
      - openerp-net

  mobile-dev:
    build:
      context: .
      dockerfile: docker/mobile/Dockerfile.dev
    image: open-erp/mobile:dev
    container_name: openerp-mobile-dev
    profiles: ["dev"]
    environment:
      NG_CLI_ANALYTICS: "false"
    ports:
      - "8100:8100"
    volumes:
      - ./src/frontend/mobile:/app/src/frontend/mobile
      - ./src/frontend/shared:/app/src/frontend/shared
      - mobile_node_modules:/app/src/frontend/mobile/node_modules
      - mobile_angular_cache:/app/src/frontend/mobile/.angular
    depends_on:
      - backend-dev
    deploy:
      resources:
        limits:
          memory: 1024M
    networks:
      - openerp-net

  catalog-dev-bootstrap:
    image: postgres:16-alpine
    profiles: ["dev"]
    depends_on:
      postgres-primary:
        condition: service_healthy
      backend-dev:
        condition: service_started
    environment:
      PGPASSWORD: openerp_dev_password
    volumes:
      - ./docker/postgres/dev:/bootstrap:ro
    entrypoint: ["sh", "-c", "until psql -h postgres-primary -U openerp -d openerp_dev -tAc \"select 1 from tenant_plugins where tenant_id='cd2729d8-aec0-423c-b2b0-2649a97d822f' and plugin_key='catalog'\" | grep -q 1; do sleep 2; done; psql -h postgres-primary -U openerp -d openerp_dev -f /bootstrap/catalog-dev-bootstrap.sql"]
    restart: "no"
    networks:
      - openerp-net

networks:
  openerp-net:
    name: openerp-net
    driver: bridge

volumes:
  postgres_primary_data:
  mongodb_data:
  redis_data:
  kafka_data:
  minio_data:
  registry_data:
  web_node_modules:
  web_angular_cache:
  mobile_node_modules:
  mobile_angular_cache:
  plugin_certs:
    name: openerp_plugin_certs
