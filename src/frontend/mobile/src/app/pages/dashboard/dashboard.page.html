<ion-header class="ion-no-border">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-title>{{ 'DASHBOARD_ORGANIZATION' | translate:{ name: auth.user()?.tenant_name || 'Open-ERP' } }}</ion-title>
    <ion-buttons slot="end">
      <button
        type="button"
        (click)="openPlugins()"
        [attr.aria-label]="'NOTIFICATION_TITLE' | translate"
        class="inline-flex items-center justify-center min-h-10 min-w-10 text-neutral-700 dark:text-neutral-300 cursor-pointer"
      >
        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="square" stroke-linejoin="miter" stroke-width="2" d="M15 17h5l-1.4-1.4A2 2 0 0118 14.2V11a6 6 0 10-12 0v3.2c0 .5-.2 1-.6 1.4L4 17h5m6 0a3 3 0 11-6 0" />
        </svg>
      </button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content>
  <div class="max-w-md mx-auto p-3 space-y-3">
    <app-notification-banner
      [items]="notifications()"
      [detailPath]="notificationDetailPath()"
    />

    <div class="bg-white dark:bg-neutral-900 border border-neutral-200 dark:border-neutral-800 p-3">
      <h1 class="text-xs font-bold uppercase tracking-wider text-neutral-900 dark:text-neutral-100">
        {{ 'DASHBOARD_WELCOME' | translate:{ name: auth.user()?.full_name || auth.user()?.email } }}
      </h1>
      <div class="flex items-center gap-2 mt-1.5">
        <app-badge [variant]="badgeInfo">{{ auth.user()?.role }}</app-badge>
        <span class="text-[11px] text-neutral-500 dark:text-neutral-400 truncate">
          {{ auth.user()?.tenant_name }}
        </span>
      </div>
    </div>

    <div>
      <h2 class="text-xs font-bold uppercase tracking-wider text-neutral-700 dark:text-neutral-300 mb-2" [appTranslate]="'DASHBOARD_WORKSPACE_READY'"></h2>

      <div class="mt-3">
        <app-sharp-button [fullWidth]="true" (clicked)="openAccount()">
          {{ 'ACCOUNT_DRAWER_TITLE' | translate }}
        </app-sharp-button>
      </div>
    </div>
  </div>
</ion-content>
