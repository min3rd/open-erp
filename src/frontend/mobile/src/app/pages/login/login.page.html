<ion-header class="ion-no-border">
  <ion-toolbar>
    <ion-title>{{ 'AUTH_LOGIN_TITLE' | translate }}</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <div class="flex min-h-full items-center justify-center p-3">
    <div class="w-full max-w-md space-y-3">
      <div class="flex flex-wrap items-center justify-end gap-2">
        <app-theme-switcher />
        <app-language-switcher />
      </div>

    @if (errorMessage()) {
      <div class="rounded-container p-2 bg-red-50 dark:bg-red-950/40 border border-red-200 dark:border-red-800 text-red-700 dark:text-red-300 text-xs">
        {{ errorMessage() }}
      </div>
    }

    <div class="rounded-container bg-surface border border-default p-3">
      <p class="text-[11px] text-muted mb-3" [appTranslate]="'AUTH_LOGIN_SUBTITLE'"></p>

      <form (ngSubmit)="handleLogin()" class="space-y-3">
        <app-sharp-input
          [label]="'AUTH_EMAIL_LABEL' | translate"
          type="email"
          [placeholder]="'AUTH_EMAIL_PLACEHOLDER' | translate"
          [(value)]="email"
          [required]="true"
        />

        <app-sharp-input
          [label]="'AUTH_PASSWORD_LABEL' | translate"
          type="password"
          [placeholder]="'AUTH_PASSWORD_PLACEHOLDER' | translate"
          [(value)]="password"
          [required]="true"
        />

        <div class="flex items-center justify-end">
          <a routerLink="/forgot-password" class="text-xs text-ink hover:underline" [appTranslate]="'AUTH_FORGOT_PASSWORD_LINK'"></a>
        </div>

        <app-sharp-button
          [type]="buttonTypeSubmit"
          [fullWidth]="true"
          [loading]="loading()"
        >
          {{ 'AUTH_LOGIN_BUTTON' | translate }}
        </app-sharp-button>
      </form>

      <div class="mt-3 border-t border-default pt-3 space-y-2">
        <p class="text-xs text-center text-muted" [appTranslate]="'AUTH_NO_ACCOUNT'"></p>
        <a routerLink="/register/personal" class="block text-center rounded-control py-2.5 min-h-10 border border-default text-xs font-medium text-ink hover:bg-surface-muted">
          {{ 'AUTH_REGISTER_PERSONAL_TAB' | translate }}
        </a>
        <a routerLink="/register/business" class="block text-center rounded-control py-2.5 min-h-10 border border-default text-xs font-medium text-ink hover:bg-surface-muted">
          {{ 'AUTH_REGISTER_BUSINESS_TAB' | translate }}
        </a>
      </div>
    </div>
  </div>
</div>
</ion-content>
