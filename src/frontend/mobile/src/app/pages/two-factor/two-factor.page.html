<ion-header class="ion-no-border">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/login" text=""></ion-back-button>
    </ion-buttons>
    <ion-title>{{ 'AUTH_2FA_TITLE' | translate }}</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <div class="max-w-md mx-auto p-3 space-y-3">
    <div class="flex flex-wrap items-center justify-end gap-2">
      <app-theme-switcher />
      <app-language-switcher />
    </div>

    @if (errorMessage()) {
      <div class="p-2 bg-red-50 dark:bg-red-950/40 border border-red-200 dark:border-red-800 text-red-700 dark:text-red-300 text-xs">
        {{ errorMessage() }}
      </div>
    }

    <div class="bg-white dark:bg-neutral-900 border border-neutral-200 dark:border-neutral-800 p-3 space-y-3">
      <div class="text-center">
        <p class="text-[11px] text-neutral-500 dark:text-neutral-400" [appTranslate]="'AUTH_2FA_INSTRUCTION'"></p>
      </div>

      @if (!useBackupCode()) {
        <div class="py-2">
          <app-pin-input
            [disabled]="loading()"
            (completed)="handle2FaComplete($event)"
            [hasError]="!!errorMessage()"
          />
        </div>
        <div class="text-center">
          <button
            type="button"
            (click)="useBackupCode.set(true)"
            class="text-xs text-neutral-600 dark:text-neutral-400 hover:underline"
            [appTranslate]="'ACCOUNT_BACKUP_CODES_TITLE'"
          ></button>
        </div>
      } @else {
        <app-sharp-input
          [label]="'ACCOUNT_BACKUP_CODES_TITLE' | translate"
          [placeholder]="'AUTH_BACKUP_CODE_PLACEHOLDER' | translate"
          [(value)]="backupCodeInput"
        />
        <div class="flex gap-2">
          <app-sharp-button
            [fullWidth]="true"
            [loading]="loading()"
            (clicked)="handleBackupCodeSubmit()"
          >
            {{ 'COMMON_CONFIRM' | translate }}
          </app-sharp-button>
          <app-sharp-button
            [variant]="buttonVariantSecondary"
            (clicked)="useBackupCode.set(false)"
          >
            {{ 'COMMON_BACK' | translate }}
          </app-sharp-button>
        </div>
      }

      <a routerLink="/login" class="block text-center text-xs font-medium text-neutral-900 dark:text-neutral-100 hover:underline">
        ← {{ 'AUTH_BACK_TO_LOGIN' | translate }}
      </a>
    </div>
  </div>
</ion-content>
