<ion-header class="ion-no-border">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/login" text=""></ion-back-button>
    </ion-buttons>
    <ion-title>{{ 'AUTH_FORGOT_PASS_TITLE' | translate }}</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <div class="max-w-md mx-auto p-3 space-y-3">
    <div class="flex flex-wrap items-center justify-end gap-2">
      <app-theme-switcher />
      <app-language-switcher />
    </div>

    <p class="text-[11px] text-neutral-500" [appTranslate]="'AUTH_FORGOT_PASS_SUBTITLE'"></p>

    @if (successMessage()) {
      <div class="p-2 bg-emerald-50 dark:bg-emerald-950/40 border border-emerald-200 dark:border-emerald-800 text-emerald-700 dark:text-emerald-300 text-xs">
        {{ successMessage() }}
      </div>
    } @else {
      @if (errorMessage()) {
        <div class="p-2 bg-red-50 dark:bg-red-950/40 border border-red-200 dark:border-red-800 text-red-700 dark:text-red-300 text-xs">
          {{ errorMessage() }}
        </div>
      }

      <div class="bg-white dark:bg-neutral-900 border border-neutral-200 dark:border-neutral-800 p-3">
        <form (ngSubmit)="handleForgotPassword()" class="space-y-3">
          <app-sharp-input
            [label]="'AUTH_EMAIL_LABEL' | translate"
            type="email"
            [placeholder]="'AUTH_EMAIL_PLACEHOLDER' | translate"
            [(value)]="email"
            [required]="true"
          />

          <app-sharp-button
            [type]="buttonTypeSubmit"
            [fullWidth]="true"
            [loading]="loading()"
          >
            {{ 'AUTH_SEND_RESET_LINK' | translate }}
          </app-sharp-button>
        </form>
      </div>
    }

    <div class="text-center">
      <a routerLink="/login" class="text-xs font-medium text-neutral-900 dark:text-neutral-100 hover:underline">
        ← {{ 'AUTH_BACK_TO_LOGIN' | translate }}
      </a>
    </div>
  </div>
</ion-content>
