<ion-header class="ion-no-border">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/dashboard" text=""></ion-back-button>
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-title class="text-sm">{{ 'CATALOG_BROWSE_TITLE' | translate }}</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content scrollY="false" class="plugin-content">
  @if (failed()) {
    <div class="p-3 text-xs text-red-700 dark:text-red-300">
      {{ 'PLUGIN_HOST_UNAVAILABLE' | translate }}
    </div>
  }
  @if (loading()) {
    <div class="absolute inset-0 flex items-center justify-center text-xs text-muted">
      {{ 'PLUGIN_HOST_LOADING' | translate }}
    </div>
  }
  <iframe
    #frame
    class="block w-full border-0"
    style="height: 100%"
    sandbox="allow-scripts allow-same-origin allow-forms allow-popups"
    [src]="src()"
    [title]="'PLUGIN_HOST_IFRAME_TITLE' | translate"
    (load)="onLoad()"
  ></iframe>
</ion-content>
