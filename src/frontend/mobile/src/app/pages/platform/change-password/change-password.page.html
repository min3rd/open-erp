<ion-header class="ion-no-border">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/dashboard" text=""></ion-back-button>
    </ion-buttons>
    <ion-title>{{ 'PASSWORD_CHANGE_REQUIRED_TITLE' | translate }}</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <div class="max-w-md mx-auto p-3 space-y-3 overflow-x-hidden">
    <div class="bg-white dark:bg-neutral-900 border border-indigo-200 dark:border-indigo-900 p-3 space-y-1">
      <h1 class="text-xs font-bold uppercase tracking-wider text-neutral-900 dark:text-neutral-100">
        {{ 'PASSWORD_CHANGE_REQUIRED_TITLE' | translate }}
      </h1>
      <p class="text-[11px] text-neutral-500 dark:text-neutral-400">
        {{ 'PASSWORD_CHANGE_REQUIRED_HINT' | translate }}
      </p>
    </div>

    <div class="bg-white dark:bg-neutral-900 border border-neutral-200 dark:border-neutral-800 p-3 space-y-3">
      <app-sharp-input
        type="password"
        [label]="'ACCOUNT_CURRENT_PASSWORD_LABEL' | translate"
        [required]="true"
        [(value)]="currentPassword"
      />
      <app-sharp-input
        type="password"
        [label]="'ACCOUNT_NEW_PASSWORD_LABEL' | translate"
        [hint]="'AUTH_PASSWORD_HINT' | translate"
        [required]="true"
        [(value)]="newPassword"
      />
      <app-sharp-input
        type="password"
        [label]="'ACCOUNT_NEW_PASSWORD_CONFIRM_LABEL' | translate"
        [required]="true"
        [(value)]="confirmPassword"
      />

      @if (error()) {
        <div class="p-2 bg-red-50 dark:bg-red-950/40 border border-red-200 dark:border-red-800 text-red-700 dark:text-red-300 text-xs">
          {{ error() }}
        </div>
      }
      @if (success()) {
        <div class="p-2 bg-emerald-50 dark:bg-emerald-950/40 border border-emerald-200 dark:border-emerald-800 text-emerald-700 dark:text-emerald-300 text-xs">
          {{ success() }}
        </div>
      }

      <app-sharp-button [fullWidth]="true" [loading]="saving()" (clicked)="submit()">
        {{ 'ACCOUNT_CHANGE_PASSWORD_BUTTON' | translate }}
      </app-sharp-button>
    </div>

    <div class="flex items-center justify-between gap-2 border border-neutral-200 dark:border-neutral-800 bg-white dark:bg-neutral-900 p-2">
      <app-language-switcher />
      <app-theme-switcher />
    </div>
  </div>
</ion-content>
