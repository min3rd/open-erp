<div class="min-h-screen bg-neutral-100 dark:bg-neutral-950 flex flex-col justify-center py-12 sm:px-6 lg:px-8">
  <div class="sm:mx-auto sm:w-full sm:max-w-md">
    <h2 class="text-center text-sm font-bold uppercase tracking-wider text-neutral-900 dark:text-neutral-100" [appTranslate]="'AUTH_FORGOT_PASS_TITLE'">
    </h2>
    <p class="mt-1 text-center text-xs text-neutral-500" [appTranslate]="'AUTH_FORGOT_PASS_SUBTITLE'">
    </p>
  </div>

  <div class="mt-6 sm:mx-auto sm:w-full sm:max-w-md">
    <div class="bg-white dark:bg-neutral-900 py-6 px-4 shadow-sm border border-neutral-200 dark:border-neutral-800 sm:px-8">
      
      @if (successMessage()) {
        <div class="p-3 bg-emerald-50 dark:bg-emerald-950/40 border border-emerald-200 dark:border-emerald-800 text-emerald-700 dark:text-emerald-300 text-xs mb-4">
          {{ successMessage() }}
        </div>
      } @else {
        @if (errorMessage()) {
          <div class="mb-4 p-2.5 bg-red-50 dark:bg-red-950/40 border border-red-200 dark:border-red-800 text-red-700 dark:text-red-300 text-xs">
            {{ errorMessage() }}
          </div>
        }

        <form (ngSubmit)="handleForgotPassword()" class="space-y-4">
          <app-sharp-input
            [label]="'AUTH_EMAIL_LABEL' | translate"
            type="email"
            [placeholder]="'AUTH_EMAIL_PLACEHOLDER' | translate"
            [(value)]="email"
            [required]="true"
          />

          <app-sharp-button
            [type]="buttonTypeSubmit"
            [fullWidth]="true"
            [loading]="loading()"
          >
            {{ 'AUTH_SEND_RESET_LINK' | translate }}
          </app-sharp-button>
        </form>
      }

      <div class="mt-4 border-t border-neutral-200 dark:border-neutral-800 pt-3 text-center">
        <a routerLink="/login" class="text-xs font-medium text-neutral-900 dark:text-neutral-100 hover:underline">
          ← {{ 'AUTH_BACK_TO_LOGIN' | translate }}
        </a>
      </div>

    </div>
  </div>
</div>
