<div class="min-h-screen bg-surface-muted flex flex-col justify-center py-12 sm:px-6 lg:px-8">
  <div class="absolute top-4 right-4">
    <app-language-switcher />
  </div>

  <div class="sm:mx-auto sm:w-full sm:max-w-md">
    <div class="flex justify-center">
      <div class="w-10 h-10 bg-accent flex items-center justify-center font-mono font-bold text-accent-contrast text-sm">
        ERP
      </div>
    </div>
    <h2 class="mt-4 text-center text-sm font-bold uppercase tracking-wider text-ink" [appTranslate]="'AUTH_SELECT_TENANT_TITLE'">
    </h2>
    <p class="mt-1 text-center text-xs text-muted" [appTranslate]="'AUTH_SELECT_TENANT_INSTRUCTION'">
    </p>
  </div>

  <div class="mt-6 sm:mx-auto sm:w-full sm:max-w-md">
    <div class="rounded-container bg-surface py-6 px-4 shadow-sm border border-default sm:px-8">
      @if (errorMessage()) {
        <div class="rounded-container mb-4 p-2.5 bg-red-50 dark:bg-red-950/40 border border-red-200 dark:border-red-800 text-red-700 dark:text-red-300 text-xs">
          {{ errorMessage() }}
        </div>
      }

      <div class="space-y-2 max-h-60 overflow-y-auto">
        @for (tenant of tenants(); track tenant.tenant_id) {
          <button
            type="button"
            [disabled]="loading()"
            (click)="handleSelectTenant(tenant.tenant_id)"
            class="w-full text-left rounded-control p-3 border border-default hover:border-accent hover:bg-surface-muted disabled:opacity-60 disabled:cursor-not-allowed transition-colors flex items-center justify-between"
          >
            <div>
              <div class="font-medium text-xs text-ink">
                {{ tenant.tenant_name }}
              </div>
              <div class="text-[10px] font-mono text-muted mt-0.5">
                {{ 'AUTH_TENANT_SLUG_ROLE' | translate:{ slug: tenant.tenant_slug, role: tenant.role } }}
              </div>
            </div>
            @if (tenant.is_default) {
              <app-badge [variant]="badgeVariantInfo">{{ 'COMMON_DEFAULT' | translate }}</app-badge>
            }
          </button>
        }
      </div>

      @if (loading()) {
        <p class="mt-4 text-center text-xs text-muted" [appTranslate]="'COMMON_LOADING'">
        </p>
      }

      <div class="mt-4">
        <app-sharp-button
          [variant]="buttonVariantSecondary"
          [fullWidth]="true"
          (clicked)="handleBack()"
        >
          {{ 'COMMON_BACK' | translate }}
        </app-sharp-button>
      </div>

      <div class="mt-4 border-t border-default pt-3 text-center">
        <a routerLink="/login" class="text-xs font-medium text-ink hover:underline">
          ← {{ 'AUTH_BACK_TO_LOGIN' | translate }}
        </a>
      </div>
    </div>
  </div>
</div>
