<div class="min-h-screen bg-neutral-100 dark:bg-neutral-950 flex flex-col justify-center py-12 sm:px-6 lg:px-8">
  <div class="sm:mx-auto sm:w-full sm:max-w-md">
    <h2 class="text-center text-sm font-bold uppercase tracking-wider text-neutral-900 dark:text-neutral-100" [appTranslate]="'AUTH_REGISTER_PERSONAL_TAB'">
    </h2>
    <p class="mt-1 text-center text-xs text-neutral-500" [appTranslate]="'AUTH_REGISTER_SUBTITLE'">
    </p>
  </div>

  <div class="mt-6 sm:mx-auto sm:w-full sm:max-w-md">
    <div class="bg-white dark:bg-neutral-900 py-6 px-4 shadow-sm border border-neutral-200 dark:border-neutral-800 sm:px-8">
      
      @if (errorMessage()) {
        <div class="mb-4 p-2.5 bg-red-50 dark:bg-red-950/40 border border-red-200 dark:border-red-800 text-red-700 dark:text-red-300 text-xs">
          {{ errorMessage() }}
        </div>
      }

      @if (step() === 'FORM') {
        <form (ngSubmit)="handleRegister()" class="space-y-3">
          <app-sharp-input
            [label]="'AUTH_FULL_NAME_LABEL' | translate"
            [placeholder]="'AUTH_FULL_NAME_PLACEHOLDER' | translate"
            [(value)]="fullName"
            [required]="true"
          />

          <app-sharp-input
            [label]="'AUTH_EMAIL_LABEL' | translate"
            type="email"
            [placeholder]="'AUTH_EMAIL_PLACEHOLDER' | translate"
            [(value)]="email"
            [required]="true"
          />

          <app-sharp-input
            [label]="'ACCOUNT_PHONE_LABEL' | translate"
            type="tel"
            [placeholder]="'ACCOUNT_PHONE_PLACEHOLDER' | translate"
            [(value)]="phone"
          />

          <app-sharp-input
            [label]="'AUTH_PASSWORD_LABEL' | translate"
            type="password"
            [placeholder]="'AUTH_PASSWORD_PLACEHOLDER' | translate"
            [hint]="'AUTH_PASSWORD_HINT' | translate"
            [(value)]="password"
            [required]="true"
          />

          <div class="pt-2">
            <app-sharp-button
              [type]="buttonTypeSubmit"
              [fullWidth]="true"
              [loading]="loading()"
            >
              {{ 'AUTH_REGISTER_BUTTON' | translate }}
            </app-sharp-button>
          </div>
        </form>
      } @else {
        <div class="space-y-4 text-center">
          <div class="w-8 h-8 mx-auto flex items-center justify-center bg-neutral-100 dark:bg-neutral-800 border border-neutral-300 dark:border-neutral-700 font-mono text-xs">
            OTP
          </div>
          <div>
            <h3 class="text-xs font-bold uppercase" [appTranslate]="'AUTH_VERIFY_EMAIL_TITLE'"></h3>
            <p class="text-[11px] text-neutral-500 mt-1">
              {{ 'AUTH_VERIFY_EMAIL_INSTRUCTION' | translate:{ email: email } }}
            </p>
          </div>

          <div class="py-2">
            <app-pin-input
              (completed)="handleVerifyOtp($event)"
              [hasError]="!!errorMessage()"
            />
          </div>

          <app-sharp-button
            [variant]="buttonVariantSecondary"
            [fullWidth]="true"
            (clicked)="step.set('FORM')"
          >
            {{ 'COMMON_BACK' | translate }}
          </app-sharp-button>
        </div>
      }

      <div class="mt-4 border-t border-neutral-200 dark:border-neutral-800 pt-3 text-center">
        <span class="text-xs text-neutral-500" [appTranslate]="'AUTH_HAVE_ACCOUNT'"></span>
        <a routerLink="/login" class="text-xs font-medium text-neutral-900 dark:text-neutral-100 hover:underline ml-1" [appTranslate]="'AUTH_LOGIN_BUTTON'">
        </a>
      </div>

    </div>
  </div>
</div>
