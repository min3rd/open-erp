<div class="min-h-screen bg-neutral-100 dark:bg-neutral-950 flex flex-col justify-center px-4 py-6 sm:px-6 lg:px-8">
  <div class="w-full max-w-md mx-auto">
    <h2 class="text-center text-sm font-bold uppercase tracking-wider text-neutral-900 dark:text-neutral-100" [appTranslate]="'AUTH_RESET_PASS_TITLE'">
    </h2>
    <p class="mt-1 text-center text-xs text-neutral-500 dark:text-neutral-400" [appTranslate]="'AUTH_RESET_PASS_SUBTITLE'">
    </p>
  </div>

  <div class="mt-4 w-full max-w-md mx-auto">
    <div class="bg-white dark:bg-neutral-900 p-4 sm:p-6 shadow-sm border border-neutral-200 dark:border-neutral-800 sm:px-8">
      
      @if (errorMessage()) {
        <div class="mb-4 p-2.5 bg-red-50 dark:bg-red-950/40 border border-red-200 dark:border-red-800 text-red-700 dark:text-red-300 text-xs">
          {{ errorMessage() }}
        </div>
      }

      @if (successMessage()) {
        <div class="space-y-4">
          <div class="p-3 bg-emerald-50 dark:bg-emerald-950/40 border border-emerald-200 dark:border-emerald-800 text-emerald-700 dark:text-emerald-300 text-xs">
            {{ successMessage() }}
          </div>
          <a
            routerLink="/login"
            class="block w-full py-1.5 bg-neutral-900 text-white dark:bg-neutral-100 dark:text-neutral-900 text-xs font-medium text-center hover:bg-neutral-800 dark:hover:bg-neutral-200"
          >
            {{ 'AUTH_BACK_TO_LOGIN' | translate }}
          </a>
        </div>
      } @else {
        <form (ngSubmit)="handleResetPassword()" class="space-y-4">
          <app-sharp-input
            [label]="'AUTH_TOKEN_LABEL' | translate"
            [placeholder]="'AUTH_TOKEN_PLACEHOLDER' | translate"
            [(value)]="token"
            [required]="true"
          />

          <app-sharp-input
            [label]="'AUTH_NEW_PASSWORD_LABEL' | translate"
            type="password"
            [placeholder]="'AUTH_PASSWORD_PLACEHOLDER' | translate"
            [hint]="'AUTH_PASSWORD_HINT' | translate"
            [(value)]="newPassword"
            [required]="true"
          />

          <app-sharp-input
            [label]="'AUTH_CONFIRM_PASSWORD_LABEL' | translate"
            type="password"
            [placeholder]="'AUTH_PASSWORD_PLACEHOLDER' | translate"
            [(value)]="confirmPassword"
            [required]="true"
          />

          <app-sharp-button
            [type]="buttonTypeSubmit"
            [fullWidth]="true"
            [loading]="loading()"
          >
            {{ 'AUTH_RESET_PASSWORD_BUTTON' | translate }}
          </app-sharp-button>
        </form>
      }

      <div class="mt-4 border-t border-neutral-200 dark:border-neutral-800 pt-3 text-center">
        <a routerLink="/login" class="text-xs font-medium text-neutral-900 dark:text-neutral-100 hover:underline">
          ← {{ 'AUTH_BACK_TO_LOGIN' | translate }}
        </a>
      </div>

    </div>
  </div>
</div>
