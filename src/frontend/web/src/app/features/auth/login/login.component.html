<div class="min-h-screen bg-neutral-100 dark:bg-neutral-950 flex flex-col lg:flex-row">
  <!-- Brand panel (desktop only) -->
  <div class="hidden lg:flex lg:w-2/5 xl:w-1/3 bg-neutral-900 dark:bg-black text-neutral-100 flex-col justify-between p-8 select-none">
    <div class="flex items-center gap-2">
      <div class="w-8 h-8 bg-white text-neutral-900 flex items-center justify-center font-mono font-bold text-xs">
        ERP
      </div>
      <span class="text-xs font-bold uppercase tracking-wider">Open-ERP</span>
    </div>

    <div class="space-y-2">
      <h2 class="text-base font-bold uppercase tracking-wider" [appTranslate]="'AUTH_LOGIN_TITLE'"></h2>
      <p class="text-xs text-neutral-400 leading-relaxed" [appTranslate]="'AUTH_LOGIN_SUBTITLE'"></p>
    </div>
  </div>

  <!-- Form column -->
  <div class="relative flex-1 flex flex-col justify-center px-4 py-6 sm:px-6">
    <!-- Top header language switcher -->
    <div class="absolute top-4 right-4">
      <app-language-switcher />
    </div>

    <div class="w-full max-w-md mx-auto">
      <div class="flex justify-center">
        <div class="w-10 h-10 bg-neutral-900 dark:bg-white flex items-center justify-center font-mono font-bold text-white dark:text-neutral-900 text-lg">
          ERP
        </div>
      </div>
      <h2 class="mt-3 text-center text-sm font-bold uppercase tracking-wider text-neutral-900 dark:text-neutral-100" [appTranslate]="'AUTH_LOGIN_TITLE'">
      </h2>
      <p class="mt-1 text-center text-xs text-neutral-500 dark:text-neutral-400" [appTranslate]="'AUTH_LOGIN_SUBTITLE'">
      </p>

      <div class="mt-4">
        <div class="bg-white dark:bg-neutral-900 p-4 sm:p-6 shadow-sm border border-neutral-200 dark:border-neutral-800 sm:px-8">

          @if (verifiedNotice()) {
            <div class="mb-4 p-2.5 bg-emerald-50 dark:bg-emerald-950/40 border border-emerald-200 dark:border-emerald-800 text-emerald-700 dark:text-emerald-300 text-xs">
              {{ 'AUTH_EMAIL_VERIFIED_NOTICE' | translate }}
            </div>
          }

          <!-- Thông báo lỗi chung -->
          @if (errorMessage()) {
            <div class="mb-4 p-2.5 bg-red-50 dark:bg-red-950/40 border border-red-200 dark:border-red-800 text-red-700 dark:text-red-300 text-xs">
              {{ errorMessage() }}
            </div>
          }

          <form (ngSubmit)="handleLogin()" class="space-y-4">
            <app-sharp-input
              [label]="'AUTH_EMAIL_LABEL' | translate"
              type="email"
              [placeholder]="'AUTH_EMAIL_PLACEHOLDER' | translate"
              [(value)]="email"
              [required]="true"
            />

            <app-sharp-input
              [label]="'AUTH_PASSWORD_LABEL' | translate"
              type="password"
              [placeholder]="'AUTH_PASSWORD_PLACEHOLDER' | translate"
              [(value)]="password"
              [required]="true"
            />

            <div class="flex items-center justify-end">
              <div class="text-xs">
                <a routerLink="/forgot-password" class="text-neutral-900 dark:text-neutral-100 hover:underline font-medium" [appTranslate]="'AUTH_FORGOT_PASSWORD_LINK'"></a>
              </div>
            </div>

            <app-sharp-button
              [type]="buttonTypeSubmit"
              [fullWidth]="true"
              [loading]="loading()"
            >
              {{ 'AUTH_LOGIN_BUTTON' | translate }}
            </app-sharp-button>
          </form>

          <div class="mt-5 border-t border-neutral-200 dark:border-neutral-800 pt-4 space-y-2">
            <p class="text-xs text-center text-neutral-500 dark:text-neutral-400" [appTranslate]="'AUTH_NO_ACCOUNT'"></p>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
              <a routerLink="/register/personal" class="text-center py-1.5 border border-neutral-300 dark:border-neutral-700 text-xs font-medium text-neutral-900 dark:text-neutral-100 hover:bg-neutral-50 dark:hover:bg-neutral-800">
                {{ 'AUTH_REGISTER_PERSONAL_TAB' | translate }}
              </a>
              <a routerLink="/register/business" class="text-center py-1.5 border border-neutral-300 dark:border-neutral-700 text-xs font-medium text-neutral-900 dark:text-neutral-100 hover:bg-neutral-50 dark:hover:bg-neutral-800">
                {{ 'AUTH_REGISTER_BUSINESS_TAB' | translate }}
              </a>
            </div>
          </div>

        </div>
      </div>
    </div>
  </div>
</div>
