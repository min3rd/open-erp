<header class="bg-neutral-900 text-white border-b border-indigo-700 select-none">
  <div class="px-2 sm:px-3 py-1.5 flex items-center justify-between gap-2">
    <div class="flex items-center gap-2 min-w-0 shrink-0">
      <div class="w-6 h-6 shrink-0 bg-indigo-600 text-white flex items-center justify-center font-mono font-bold text-[10px]">
        ERP
      </div>
      <span class="hidden sm:inline text-[11px] font-bold uppercase tracking-wider text-neutral-100 whitespace-nowrap">
        {{ 'PLATFORM_PORTAL_TITLE' | translate }}
      </span>
      <app-badge class="shrink-0" [variant]="badgeVariantInfo">{{ roleBadgeKey() | translate }}</app-badge>
      @if (!isSuperAdmin()) {
        <span class="hidden lg:inline text-[10px] uppercase tracking-wider text-amber-300 whitespace-nowrap">
          {{ 'PLATFORM_SUPPORT_READ_ONLY_HINT' | translate }}
        </span>
      }
    </div>

    <div class="flex flex-1 flex-wrap items-center justify-end gap-x-1.5 gap-y-1 sm:gap-x-3 min-w-0">
      <app-user-menu
        class="shrink-0"
        [userName]="userEmail()"
        [userEmail]="userEmail()"
        [showAccount]="false"
        (logout)="logout()"
      />
    </div>
  </div>
</header>
