<div class="h-screen overflow-hidden bg-surface-muted text-ink flex flex-col">
  <app-topbar
    [tenantName]="auth.user()?.tenant_name || ''"
    [role]="auth.user()?.role || 'MEMBER'"
    [userName]="auth.user()?.full_name || ''"
    [userEmail]="auth.user()?.email || ''"
    [settingsPath]="auth.canAccessSettings() ? '/settings/roles' : null"
    [platformPath]="auth.isPlatformAdmin() ? '/platform/tenants' : null"
    [notifications]="notifications()"
    [notificationUnreadCount]="notificationUnreadCount()"
    [notificationDetailPath]="notificationDetailPath()"
    (openAccount)="openAccount()"
    (logout)="logout()"
    (markNotificationRead)="onMarkNotificationRead($event)"
    (markAllNotificationsRead)="onMarkAllNotificationsRead()"
    (openNotificationDetail)="onOpenNotificationDetail()"
  />

  <!-- Menu placement is a per-user preference (AUTO = the colour theme's own
       default): a vertical rail (left/right), a horizontal bar, or a drawer.
       How the rail is displayed is controlled by the collapse action inside
       the menu itself, not by the layout choice. -->
  @if (navTop()) {
    <div class="border-b border-default bg-sidebar px-2">
      <app-section-nav variant="bar" [items]="menuItems()" titleKey="SETTINGS_SECTION_TITLE" />
    </div>
  }

  @if (navDrawer()) {
    <div class="border-b border-default bg-sidebar px-2 py-1">
      <button
        type="button"
        (click)="menuOpen.set(true)"
        [attr.aria-expanded]="menuOpen()"
        aria-controls="settings-menu-drawer"
        class="inline-flex min-h-8 items-center gap-1.5 rounded-control px-2.5 py-1 text-xs font-semibold text-sidebar-active-text transition-colors hover:bg-sidebar-active/60 cursor-pointer"
      >
        <app-icon name="menu" [decorative]="true" />
        {{ 'COMMON_MENU' | translate }}
      </button>
    </div>
  }

  <div [class]="'flex-1 flex flex-col min-h-0 ' + (navRight() ? 'lg:flex-row-reverse' : 'lg:flex-row')">
    @if (navRail()) {
      <aside
        [class]="'lg:shrink-0 border-b lg:border-b-0 border-default bg-sidebar p-1.5 overflow-y-auto ' + railWidth()
          + (navRight() ? ' lg:border-s' : ' lg:border-e')"
      >
        <app-section-nav
          [variant]="navVariant()"
          [items]="menuItems()"
          [collapsed]="railCollapsed()"
          [flyoutAlign]="navRight() ? 'end' : 'start'"
          (toggleCollapse)="toggleRail()"
          titleKey="SETTINGS_SECTION_TITLE"
        />
      </aside>
    }

    <main class="flex-1 min-w-0 p-2 sm:p-3 space-y-2 overflow-y-auto">
      <app-notification-banner
        [items]="notifications()"
        [detailPath]="notificationDetailPath()"
      />
      <router-outlet />
    </main>
  </div>

  @if (navDrawer()) {
    <app-drawer
      id="settings-menu-drawer"
      [isOpen]="menuOpen()"
      [title]="'SETTINGS_SECTION_TITLE' | translate"
      (close)="menuOpen.set(false)"
    >
      <div (click)="menuOpen.set(false)">
        <app-section-nav [items]="menuItems()" />
      </div>
    </app-drawer>
  }
</div>
