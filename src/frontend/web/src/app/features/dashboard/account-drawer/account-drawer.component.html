<app-drawer
  [isOpen]="isOpen()"
  [title]="'ACCOUNT_DRAWER_TITLE' | translate"
  [subtitle]="'ACCOUNT_DRAWER_SUBTITLE' | translate"
  width="w-[440px] max-w-[100vw]"
  [zIndex]="50"
  [shiftLeft]="isStackedRouteActive()"
  [closeOnEscape]="!isStackedRouteActive()"
  (close)="onClose()"
>
  <!-- Navigation Tabs (URL driven) -->
  <div class="flex border-b border-default -mx-4 px-4 bg-surface-muted">
    <a
      routerLink="/account/detail"
      routerLinkActive="border-accent text-ink font-bold"
      class="px-3 py-2 text-xs border-b-2 border-transparent text-muted hover:text-ink transition-colors uppercase tracking-wider"
    >
      {{ 'ACCOUNT_TAB_PROFILE' | translate }}
    </a>

    <a
      routerLink="/account/security"
      routerLinkActive="border-accent text-ink font-bold"
      class="px-3 py-2 text-xs border-b-2 border-transparent text-muted hover:text-ink transition-colors uppercase tracking-wider"
    >
      {{ 'ACCOUNT_TAB_SECURITY' | translate }}
    </a>

    <a
      routerLink="/account/sessions"
      routerLinkActive="border-accent text-ink font-bold"
      class="px-3 py-2 text-xs border-b-2 border-transparent text-muted hover:text-ink transition-colors uppercase tracking-wider"
    >
      {{ 'ACCOUNT_TAB_SESSIONS' | translate }}
    </a>
  </div>

  <!-- Active tab content via nested routes -->
  <ng-content></ng-content>

  <div drawer-footer>
    <app-sharp-button [variant]="buttonVariantSecondary" (clicked)="onClose()">
      {{ 'COMMON_CLOSE' | translate }}
    </app-sharp-button>
  </div>
</app-drawer>
