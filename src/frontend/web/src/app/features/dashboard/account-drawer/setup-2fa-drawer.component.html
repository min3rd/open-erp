<app-drawer
  [isOpen]="isOpen()"
  [title]="'ACCOUNT_2FA_SETUP_TITLE' | translate"
  [subtitle]="'ACCOUNT_2FA_SETUP_SUBTITLE' | translate"
  width="max-w-lg"
  [zIndex]="60"
  (close)="onClose()"
>
  @if (loadingSetup()) {
    <div class="py-12 text-center text-xs text-neutral-500" [appTranslate]="'COMMON_LOADING'">
    </div>
  } @else if (setupData()) {
    <div class="space-y-4">
      @if (errorMessage()) {
        <div class="p-2.5 bg-red-50 dark:bg-red-950/40 border border-red-200 dark:border-red-800 text-red-700 dark:text-red-300 text-xs">
          {{ errorMessage() }}
        </div>
      }

      <!-- Bước 1: Quét mã QR hoặc nhập Secret -->
      <div class="border border-neutral-200 dark:border-neutral-800 p-3 bg-neutral-50 dark:bg-neutral-950">
        <h4 class="text-xs font-bold uppercase text-neutral-800 dark:text-neutral-200 mb-1" [appTranslate]="'ACCOUNT_2FA_STEP_1'">
        </h4>
        <p class="text-[11px] text-neutral-500 mb-2" [appTranslate]="'ACCOUNT_2FA_STEP_2'">
        </p>

        <div class="p-2 bg-white dark:bg-neutral-900 border border-neutral-300 dark:border-neutral-700 font-mono text-xs select-all text-center break-all">
          {{ setupData()?.secret_key }}
        </div>
        <p class="text-[10px] text-neutral-400 mt-1 text-center font-mono">
          URI: {{ setupData()?.qr_code_uri }}
        </p>
      </div>

      <!-- Bước 2: Lưu mã dự phòng -->
      <div class="border border-neutral-200 dark:border-neutral-800 p-3 bg-neutral-50 dark:bg-neutral-950">
        <div class="flex justify-between items-center mb-1">
          <h4 class="text-xs font-bold uppercase text-neutral-800 dark:text-neutral-200" [appTranslate]="'ACCOUNT_BACKUP_CODES_TITLE'">
          </h4>
          <button 
            type="button" 
            (click)="copyBackupCodes()"
            class="text-[11px] text-neutral-900 dark:text-neutral-100 hover:underline font-mono"
          >
            {{ copied() ? ('COMMON_CONFIRM' | translate) : 'Copy All' }}
          </button>
        </div>
        <p class="text-[11px] text-neutral-500 mb-2" [appTranslate]="'ACCOUNT_2FA_BACKUP_WARNING'">
        </p>

        <div class="grid grid-cols-2 gap-1.5 font-mono text-xs">
          @for (code of setupData()?.backup_codes; track $index) {
            <div class="px-2 py-1 bg-white dark:bg-neutral-900 border border-neutral-300 dark:border-neutral-700 text-center select-all">
              {{ code }}
            </div>
          }
        </div>
      </div>

      <!-- Bước 3: Xác thực kích hoạt -->
      <div class="border border-neutral-200 dark:border-neutral-800 p-3">
        <h4 class="text-xs font-bold uppercase text-neutral-800 dark:text-neutral-200 mb-1" [appTranslate]="'ACCOUNT_2FA_STEP_3'">
        </h4>
        <p class="text-[11px] text-neutral-500 mb-3" [appTranslate]="'AUTH_2FA_INSTRUCTION'">
        </p>

        <app-pin-input
          (completed)="handleEnable2Fa($event)"
          [hasError]="!!errorMessage()"
        />
      </div>
    </div>
  }

  <div drawer-footer>
    <app-sharp-button [variant]="buttonVariantSecondary" (clicked)="onClose()">
      {{ 'COMMON_CANCEL' | translate }}
    </app-sharp-button>
  </div>
</app-drawer>
