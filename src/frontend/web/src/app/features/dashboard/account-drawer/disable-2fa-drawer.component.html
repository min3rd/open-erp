<app-drawer
  [isOpen]="true"
  [title]="'ACCOUNT_2FA_DISABLE_TITLE' | translate"
  [subtitle]="'ACCOUNT_2FA_DISABLE_SUBTITLE' | translate"
  width="w-[380px] max-w-[100vw]"
  [zIndex]="60"
  (close)="onClose()"
>
  <div class="space-y-4">
    <div class="p-3 bg-amber-50 dark:bg-amber-950/30 border border-amber-300 dark:border-amber-800 text-amber-800 dark:text-amber-200 text-xs" [appTranslate]="'ACCOUNT_2FA_DISABLE_WARNING'">
    </div>

    @if (errorMessage()) {
      <div class="p-2.5 bg-red-50 dark:bg-red-950/40 border border-red-200 dark:border-red-800 text-red-700 dark:text-red-300 text-xs">
        {{ errorMessage() }}
      </div>
    }

    <form (ngSubmit)="handleDisable()" class="space-y-3">
      <app-sharp-input
        [label]="'ACCOUNT_2FA_DISABLE_PASSWORD_LABEL' | translate"
        type="password"
        [placeholder]="'AUTH_PASSWORD_PLACEHOLDER' | translate"
        [(value)]="currentPassword"
        [required]="true"
      />

      <app-sharp-input
        [label]="'ACCOUNT_2FA_DISABLE_OTP_LABEL' | translate"
        [placeholder]="'ACCOUNT_2FA_OTP_PLACEHOLDER' | translate"
        [(value)]="code"
        [required]="true"
      />

      <div class="pt-2">
        <app-sharp-button
          [type]="buttonTypeSubmit"
          [variant]="buttonVariantDanger"
          [fullWidth]="true"
          [loading]="loading()"
        >
          {{ 'ACCOUNT_2FA_CONFIRM_DISABLE' | translate }}
        </app-sharp-button>
      </div>
    </form>
  </div>

  <div drawer-footer>
    <app-sharp-button [variant]="buttonVariantSecondary" (clicked)="onClose()">
      {{ 'COMMON_CANCEL' | translate }}
    </app-sharp-button>
  </div>
</app-drawer>
