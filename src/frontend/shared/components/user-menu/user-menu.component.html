<div class="relative">
  <button
    type="button"
    (click)="toggle()"
    [attr.aria-expanded]="open()"
    aria-haspopup="menu"
    [attr.aria-label]="'COMMON_ACCOUNT_SETTINGS' | translate"
    class="flex items-center gap-2 rounded-control px-2.5 py-1 text-xs border border-default bg-transparent hover:bg-surface-muted transition-colors cursor-pointer"
  >
    <span class="w-4 h-4 shrink-0 bg-default flex items-center justify-center text-[10px] font-bold text-ink">
      {{ initial() }}
    </span>
    <span class="font-medium truncate max-w-[140px] text-ink">
      {{ displayName() }}
    </span>
    <app-icon
      name="chevron-down"
      [decorative]="true"
      class="text-muted transition-transform"
      [class.rotate-180]="open()"
    />
  </button>

  @if (open()) {
    <div
      role="menu"
      class="op-pop absolute right-0 top-full z-50 mt-1 w-64 rounded-container border border-default bg-surface shadow-panel p-2 space-y-2"
    >
      <div class="border-b border-default pb-2">
        <p class="truncate text-xs font-semibold text-ink">{{ displayName() }}</p>
        @if (userEmail()) {
          <p class="truncate text-[11px] text-muted">{{ userEmail() }}</p>
        }
      </div>

      <div class="space-y-1.5">
        <app-theme-switcher />
        <app-language-switcher />
      </div>

      <div class="space-y-0.5 border-t border-default pt-2">
        @if (settingsPath()) {
          <a
            role="menuitem"
            [routerLink]="settingsPath()"
            (click)="open.set(false)"
            class="block w-full min-h-10 rounded-control px-2 py-1.5 text-left text-xs text-ink transition-colors hover:bg-surface-muted"
          >
            {{ 'SETTINGS_SECTION_TITLE' | translate }}
          </a>
        }
        @if (platformPath()) {
          <a
            role="menuitem"
            [routerLink]="platformPath()"
            (click)="open.set(false)"
            class="block w-full min-h-10 rounded-control px-2 py-1.5 text-left text-xs text-indigo-600 transition-colors hover:bg-surface-muted dark:text-indigo-400"
          >
            {{ 'PLATFORM_SECTION_TITLE' | translate }}
          </a>
        }
        @if (showAccount()) {
          <button
            type="button"
            role="menuitem"
            (click)="onAccount()"
            class="w-full min-h-10 rounded-control px-2 py-1.5 text-left text-xs text-ink transition-colors hover:bg-surface-muted cursor-pointer"
          >
            {{ 'COMMON_ACCOUNT_SETTINGS' | translate }}
          </button>
        }
        <button
          type="button"
          role="menuitem"
          (click)="onLogout()"
          class="w-full min-h-10 rounded-control px-2 py-1.5 text-left text-xs text-red-600 transition-colors hover:bg-surface-muted dark:text-red-400 cursor-pointer"
        >
          {{ 'COMMON_LOGOUT' | translate }}
        </button>
      </div>
    </div>
  }
</div>
