<div class="relative">
  <button
    type="button"
    (click)="toggle()"
    [attr.aria-expanded]="open()"
    aria-haspopup="menu"
    [attr.aria-label]="'COMMON_ACCOUNT_SETTINGS' | translate"
    class="flex items-center gap-2 px-2.5 py-1 text-xs border border-neutral-300 dark:border-neutral-700 bg-transparent hover:bg-neutral-50 dark:hover:bg-neutral-800 transition-colors cursor-pointer"
  >
    <span class="w-4 h-4 shrink-0 bg-neutral-200 dark:bg-neutral-700 flex items-center justify-center text-[10px] font-bold text-neutral-800 dark:text-neutral-200">
      {{ initial() }}
    </span>
    <span class="font-medium truncate max-w-[140px] text-neutral-800 dark:text-neutral-200">
      {{ displayName() }}
    </span>
    <svg class="w-3.5 h-3.5 shrink-0 text-neutral-400 transition-transform" [class.rotate-180]="open()" fill="none" viewBox="0 0 24 24" stroke="currentColor">
      <path stroke-linecap="square" stroke-linejoin="miter" stroke-width="2" d="M19 9l-7 7-7-7" />
    </svg>
  </button>

  @if (open()) {
    <div
      role="menu"
      class="absolute right-0 top-full z-50 mt-1 w-64 border border-neutral-200 dark:border-neutral-800 bg-white dark:bg-neutral-900 shadow-lg p-2 space-y-2"
    >
      <div class="border-b border-neutral-200 dark:border-neutral-800 pb-2">
        <p class="truncate text-xs font-semibold text-neutral-900 dark:text-neutral-100">{{ displayName() }}</p>
        @if (userEmail()) {
          <p class="truncate text-[11px] text-neutral-500 dark:text-neutral-400">{{ userEmail() }}</p>
        }
      </div>

      <div class="space-y-1.5">
        <app-theme-switcher />
        <app-language-switcher />
      </div>

      <div class="space-y-0.5 border-t border-neutral-200 dark:border-neutral-800 pt-2">
        @if (settingsPath()) {
          <a
            role="menuitem"
            [routerLink]="settingsPath()"
            (click)="open.set(false)"
            class="block w-full min-h-10 px-2 py-1.5 text-left text-xs text-neutral-700 transition-colors hover:bg-neutral-100 dark:text-neutral-200 dark:hover:bg-neutral-800"
          >
            {{ 'SETTINGS_SECTION_TITLE' | translate }}
          </a>
        }
        @if (platformPath()) {
          <a
            role="menuitem"
            [routerLink]="platformPath()"
            (click)="open.set(false)"
            class="block w-full min-h-10 px-2 py-1.5 text-left text-xs text-indigo-600 transition-colors hover:bg-neutral-100 dark:text-indigo-400 dark:hover:bg-neutral-800"
          >
            {{ 'PLATFORM_SECTION_TITLE' | translate }}
          </a>
        }
        @if (showAccount()) {
          <button
            type="button"
            role="menuitem"
            (click)="onAccount()"
            class="w-full min-h-10 px-2 py-1.5 text-left text-xs text-neutral-700 transition-colors hover:bg-neutral-100 dark:text-neutral-200 dark:hover:bg-neutral-800 cursor-pointer"
          >
            {{ 'COMMON_ACCOUNT_SETTINGS' | translate }}
          </button>
        }
        <button
          type="button"
          role="menuitem"
          (click)="onLogout()"
          class="w-full min-h-10 px-2 py-1.5 text-left text-xs text-red-600 transition-colors hover:bg-neutral-100 dark:text-red-400 dark:hover:bg-neutral-800 cursor-pointer"
        >
          {{ 'COMMON_LOGOUT' | translate }}
        </button>
      </div>
    </div>
  }
</div>
