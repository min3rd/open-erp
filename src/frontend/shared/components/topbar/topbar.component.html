<header class="h-11 lg:h-12 bg-surface border-b border-default px-3 sm:px-4 flex items-center justify-between gap-2 select-none">
  <!-- Left section: Brand & Context (context hidden below lg) -->
  <div class="flex items-center gap-2 min-w-0">
    <div class="w-7 h-7 shrink-0 bg-accent text-accent-contrast flex items-center justify-center font-mono font-bold text-xs">
      ERP
    </div>
    <span class="hidden sm:inline text-xs font-bold uppercase tracking-wider text-ink">
      Open-ERP
    </span>
    <div class="hidden lg:flex items-center gap-2 min-w-0">
      <span class="text-muted">/</span>
      <span class="text-xs font-medium text-muted truncate max-w-[160px]">
        {{ tenantName() || ('AUTH_SELECT_TENANT_TITLE' | translate) }}
      </span>
      <app-badge [variant]="colorInfo">{{ role() || 'MEMBER' }}</app-badge>
    </div>
  </div>

  <!-- Right section: account menu (>= lg) + mobile hamburger -->
  <div class="flex items-center gap-2 lg:gap-3">
    <div class="hidden lg:flex items-center gap-2">
      <app-notification-bell
        [items]="notifications()"
        [unreadCount]="notificationUnreadCount()"
        [detailPath]="notificationDetailPath()"
        (markRead)="markNotificationRead.emit($event)"
        (markAllRead)="markAllNotificationsRead.emit()"
        (openDetail)="openNotificationDetail.emit($event)"
      />
      <app-user-menu
        [userName]="userName()"
        [userEmail]="userEmail()"
        [settingsPath]="settingsPath()"
        [platformPath]="platformPath()"
        (openAccount)="openAccount.emit()"
        (logout)="logout.emit()"
      />
    </div>

    <!-- Mobile hamburger -->
    <button
      type="button"
      (click)="toggleMobileMenu()"
      class="lg:hidden inline-flex items-center justify-center min-h-10 min-w-10 p-1.5 text-ink hover:bg-surface-muted transition-colors cursor-pointer"
      [attr.aria-label]="'COMMON_MENU' | translate"
      [attr.aria-expanded]="mobileMenuOpen()"
      aria-controls="mobile-nav-drawer"
    >
      <app-icon name="menu" size="md" [decorative]="true" />
    </button>
  </div>
</header>

<app-mobile-nav-drawer
  id="mobile-nav-drawer"
  [isOpen]="mobileMenuOpen()"
  [tenantName]="tenantName()"
  [role]="role()"
  [userName]="userName()"
  [userEmail]="userEmail()"
  (close)="closeMobileMenu()"
  (logout)="logout.emit()"
/>
