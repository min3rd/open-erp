<header class="h-11 lg:h-12 bg-white dark:bg-neutral-900 border-b border-neutral-200 dark:border-neutral-800 px-3 sm:px-4 flex items-center justify-between gap-2 select-none">
  <!-- Left section: Brand & Context (context hidden below lg) -->
  <div class="flex items-center gap-2 min-w-0">
    <div class="w-7 h-7 shrink-0 bg-neutral-900 dark:bg-white text-white dark:text-neutral-900 flex items-center justify-center font-mono font-bold text-xs">
      ERP
    </div>
    <span class="hidden sm:inline text-xs font-bold uppercase tracking-wider text-neutral-900 dark:text-neutral-100">
      Open-ERP
    </span>
    <div class="hidden lg:flex items-center gap-2 min-w-0">
      <span class="text-neutral-300 dark:text-neutral-700">/</span>
      <span class="text-xs font-medium text-neutral-600 dark:text-neutral-300 truncate max-w-[160px]">
        {{ tenantName() || ('AUTH_SELECT_TENANT_TITLE' | translate) }}
      </span>
      <app-badge [variant]="colorInfo">{{ role() || 'MEMBER' }}</app-badge>
    </div>
  </div>

  <!-- Right section: account menu (>= lg) + mobile hamburger -->
  <div class="flex items-center gap-2 lg:gap-3">
    <div class="hidden lg:flex items-center">
      <app-user-menu
        [userName]="userName()"
        [userEmail]="userEmail()"
        [settingsPath]="settingsPath()"
        [platformPath]="platformPath()"
        (openAccount)="openAccount.emit()"
        (logout)="logout.emit()"
      />
    </div>

    <!-- Mobile hamburger -->
    <button
      type="button"
      (click)="toggleMobileMenu()"
      class="lg:hidden inline-flex items-center justify-center min-h-10 min-w-10 p-1.5 text-neutral-700 dark:text-neutral-300 hover:bg-neutral-100 dark:hover:bg-neutral-800 transition-colors cursor-pointer"
      [attr.aria-label]="'COMMON_MENU' | translate"
      [attr.aria-expanded]="mobileMenuOpen()"
      aria-controls="mobile-nav-drawer"
    >
      <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="square" stroke-linejoin="miter" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
      </svg>
    </button>
  </div>
</header>

<app-mobile-nav-drawer
  id="mobile-nav-drawer"
  [isOpen]="mobileMenuOpen()"
  [tenantName]="tenantName()"
  [role]="role()"
  [userName]="userName()"
  [userEmail]="userEmail()"
  (close)="closeMobileMenu()"
  (logout)="logout.emit()"
/>
