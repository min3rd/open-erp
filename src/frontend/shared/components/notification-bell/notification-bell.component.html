<div class="relative">
  <button
    type="button"
    (click)="toggle()"
    [attr.aria-expanded]="open()"
    aria-haspopup="menu"
    [attr.aria-label]="'NOTIFICATION_TITLE' | translate"
    class="relative inline-flex items-center justify-center min-h-10 min-w-10 p-1.5 text-neutral-700 dark:text-neutral-300 hover:bg-neutral-100 dark:hover:bg-neutral-800 transition-colors cursor-pointer"
  >
    <svg class="w-[18px] h-[18px]" fill="none" viewBox="0 0 24 24" stroke="currentColor">
      <path stroke-linecap="square" stroke-linejoin="miter" stroke-width="2" d="M15 17h5l-1.4-1.4A2 2 0 0118 14.2V11a6 6 0 10-12 0v3.2c0 .5-.2 1-.6 1.4L4 17h5m6 0a3 3 0 11-6 0" />
    </svg>
    @if (unreadCount() > 0) {
      <span class="absolute -right-0.5 -top-0.5">
        <app-badge [variant]="badgeVariant()">{{ unreadCount() > 99 ? '99+' : unreadCount() }}</app-badge>
      </span>
    }
  </button>

  @if (open()) {
    <div
      role="menu"
      class="absolute right-0 top-full z-50 mt-1 w-72 border border-neutral-200 dark:border-neutral-800 bg-white dark:bg-neutral-900 shadow-lg"
    >
      <div class="flex items-center justify-between gap-2 border-b border-neutral-200 dark:border-neutral-800 px-2 py-1.5">
        <span class="text-xs font-semibold text-neutral-900 dark:text-neutral-100">{{ 'NOTIFICATION_TITLE' | translate }}</span>
        @if (unreadCount() > 0) {
          <button
            type="button"
            (click)="onMarkAllRead()"
            class="min-h-10 px-1 text-[11px] text-sky-600 hover:underline dark:text-sky-400 cursor-pointer"
          >
            {{ 'NOTIFICATION_MARK_ALL_READ' | translate }}
          </button>
        }
      </div>

      <div class="max-h-80 overflow-y-auto">
        @if (items().length === 0) {
          <p class="px-2 py-3 text-[11px] text-neutral-500 dark:text-neutral-400">{{ 'NOTIFICATION_EMPTY' | translate }}</p>
        }
        @for (item of items(); track item.id) {
          <div
            class="flex items-start gap-1.5 border-b border-neutral-100 px-2 py-1.5 last:border-b-0 dark:border-neutral-800"
            [class]="item.read_at ? '' : 'bg-sky-50 dark:bg-sky-950/40'"
          >
            <button
              type="button"
              (click)="onOpenDetail(item.type)"
              class="min-w-0 flex-1 text-left cursor-pointer"
            >
              <span class="block text-xs text-neutral-800 dark:text-neutral-200">{{ item.title_key | translate }}</span>
              <span class="mt-0.5 block font-mono text-[10px] uppercase text-neutral-400">{{ item.severity }}</span>
            </button>
            @if (!item.read_at) {
              <button
                type="button"
                (click)="onMarkRead(item.id, $event)"
                [attr.aria-label]="'NOTIFICATION_MARK_READ' | translate"
                class="inline-flex shrink-0 items-center justify-center min-h-10 min-w-10 text-neutral-500 hover:text-emerald-600 dark:text-neutral-400 dark:hover:text-emerald-400 cursor-pointer"
              >
                <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="square" stroke-linejoin="miter" stroke-width="2" d="M5 13l4 4L19 7" />
                </svg>
              </button>
            }
          </div>
        }
      </div>

      @if (detailPath()) {
        <a
          role="menuitem"
          [routerLink]="detailPath()"
          (click)="open.set(false)"
          class="block border-t border-neutral-200 dark:border-neutral-800 px-2 py-1.5 text-center text-[11px] text-sky-600 hover:bg-neutral-100 dark:text-sky-400 dark:hover:bg-neutral-800"
        >
          {{ 'NOTIFICATION_VIEW_DETAILS' | translate }}
        </a>
      }
    </div>
  }
</div>
