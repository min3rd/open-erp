@if (isOpen()) {
  <div 
    class="fixed inset-0 overflow-hidden transition-opacity duration-200"
    [style.z-index]="zIndex()"
  >
    <!-- Backdrop -->
    <div 
      class="absolute inset-0 bg-neutral-950/40 backdrop-blur-[1px] transition-opacity"
      (click)="onBackdropClick()"
    ></div>

    <!-- Slide-over panel -->
    <div class="fixed inset-y-0 right-0 pl-10 max-w-full flex">
      <div 
        class="w-screen bg-white dark:bg-neutral-900 border-l border-neutral-200 dark:border-neutral-800 shadow-2xl flex flex-col transform transition-transform ease-in-out duration-300 translate-x-0"
        [class]="width()"
      >
        <!-- Header -->
        <div class="px-4 py-3 border-b border-neutral-200 dark:border-neutral-800 flex items-center justify-between bg-neutral-50 dark:bg-neutral-950">
          <div>
            <h2 class="text-xs font-semibold uppercase tracking-wider text-neutral-900 dark:text-neutral-100">
              {{ title() }}
            </h2>
            @if (subtitle()) {
              <p class="text-[11px] text-neutral-500 dark:text-neutral-400 mt-0.5">
                {{ subtitle() }}
              </p>
            }
          </div>
          <button 
            type="button" 
            (click)="onClose()"
            class="p-1 text-neutral-400 hover:text-neutral-700 dark:hover:text-neutral-200 rounded-none hover:bg-neutral-200 dark:hover:bg-neutral-800 transition-colors"
            [title]="'COMMON_CLOSE' | translate"
          >
            <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="square" stroke-linejoin="miter" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
            </svg>
          </button>
        </div>

        <!-- Body -->
        <div class="flex-1 overflow-y-auto p-4 space-y-4 text-xs text-neutral-800 dark:text-neutral-200">
          <ng-content></ng-content>
        </div>

        <!-- Footer (Optional) -->
        <div class="px-4 py-2.5 border-t border-neutral-200 dark:border-neutral-800 bg-neutral-50 dark:bg-neutral-950 flex justify-end gap-2">
          <ng-content select="[drawer-footer]"></ng-content>
        </div>
      </div>
    </div>
  </div>
}
