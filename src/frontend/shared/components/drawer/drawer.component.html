@if (isOpen()) {
  <div 
    class="fixed inset-0 overflow-hidden transition-opacity duration-200"
    [style.z-index]="zIndex()"
  >
    <!-- Backdrop -->
    <div 
      class="absolute inset-0 bg-neutral-950/40 backdrop-blur-[1px] transition-opacity"
      (click)="onBackdropClick()"
    ></div>

    <!-- Slide-over panel -->
    <div class="fixed inset-y-0 right-0 pl-0 sm:pl-10 w-full sm:w-auto max-w-full flex justify-end">
      <div 
        #panel
        role="dialog"
        aria-modal="true"
        tabindex="-1"
        [attr.aria-labelledby]="titleId"
        [class]="panelClasses()"
      >
        <!-- Header -->
        <div class="px-4 py-3 border-b border-default flex items-center justify-between bg-surface-muted">
          <div>
            <h2 [id]="titleId" class="text-xs font-semibold uppercase tracking-wider text-ink">
              {{ title() }}
            </h2>
            @if (subtitle()) {
              <p class="text-[11px] text-muted mt-0.5">
                {{ subtitle() }}
              </p>
            }
          </div>
          <button 
            type="button" 
            (click)="onClose()"
            class="p-1 min-h-10 min-w-10 sm:min-h-0 sm:min-w-0 inline-flex items-center justify-center text-muted hover:text-ink rounded-control hover:bg-surface-muted transition-colors"
            [title]="'COMMON_CLOSE' | translate"
          >
            <app-icon name="x" [labelKey]="'COMMON_CLOSE'" />
          </button>
        </div>

        <!-- Body -->
        <div class="flex-1 overflow-y-auto p-4 space-y-4 text-xs text-ink">
          <ng-content></ng-content>
        </div>

        <!-- Footer (Optional) -->
        <div class="px-4 py-2.5 border-t border-default bg-surface-muted flex justify-end gap-2 [&_button]:min-h-10 sm:[&_button]:min-h-0">
          <ng-content select="[drawer-footer]"></ng-content>
        </div>
      </div>
    </div>
  </div>
}
