<div class="border border-neutral-200 dark:border-neutral-800 bg-surface p-2 rounded-none">
  <div class="flex items-center justify-between gap-1 overflow-x-auto">
    @for (step of steps; track step.key; let last = $last) {
      <button
        type="button"
        (click)="onSelectStep(step)"
        [disabled]="locked()"
        class="flex items-center gap-1.5 px-2 py-1 text-xs font-mono transition-colors rounded-none border"
        [ngClass]="{
          'bg-primary text-white border-primary font-semibold': step.key === currentStep(),
          'bg-success/10 text-success border-success/30': step.order < currentOrder(),
          'bg-surface-muted text-muted border-neutral-200 dark:border-neutral-800': step.order > currentOrder()
        }"
      >
        <span
          class="w-4 h-4 flex items-center justify-center text-[10px] font-bold rounded-none"
          [ngClass]="{
            'bg-white text-primary': step.key === currentStep(),
            'bg-success text-white': step.order < currentOrder(),
            'bg-neutral-300 dark:bg-neutral-700 text-default': step.order > currentOrder()
          }"
        >
          @if (step.order < currentOrder()) {
            ✓
          } @else {
            {{ step.order }}
          }
        </span>
        <span class="whitespace-nowrap">{{ step.labelKey | translate }}</span>
      </button>

      @if (!last) {
        <div class="h-0.5 flex-1 min-w-4 bg-neutral-200 dark:border-neutral-800"></div>
      }
    }
  </div>
</div>
