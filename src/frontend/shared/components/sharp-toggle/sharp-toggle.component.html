<button
  type="button"
  role="switch"
  [attr.aria-checked]="checked()"
  [attr.aria-label]="ariaLabel() || null"
  [attr.title]="title() || null"
  [disabled]="disabled()"
  (click)="toggle()"
  class="op-press relative inline-flex shrink-0 items-center justify-center transition-colors disabled:opacity-40 disabled:cursor-not-allowed focus:outline-none focus:ring-1 focus:ring-muted"
  [class.h-4]="size() === 'sm'"
  [class.w-7]="size() === 'sm'"
  [class.h-10]="size() === 'touch'"
  [class.w-11]="size() === 'touch'"
>
  <span
    class="relative inline-flex h-4 w-7 items-center rounded-inline border transition-colors"
    [class.bg-accent]="checked()"
    [class.border-accent]="checked()"
    [class.bg-surface-muted]="!checked()"
    [class.border-default]="!checked()"
  >
    <span
      class="inline-block h-3 w-3 transition-[margin] rounded-inline"
      [class]="checked() ? 'ms-3.5' : 'ms-0.5'"
      [class.bg-accent-contrast]="checked()"
      [class.bg-muted]="!checked()"
    ></span>
  </span>
</button>
