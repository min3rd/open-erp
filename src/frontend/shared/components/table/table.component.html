<div class="border border-default bg-surface overflow-x-auto">
  <table class="w-full text-xs border-collapse">
    <thead class="bg-surface-muted">
      <tr>
        @for (column of columns(); track column.key) {
          <th [class]="headerClasses(column)" [style.width]="column.width || 'auto'">
            {{ column.labelKey | translate }}
          </th>
        }
      </tr>
    </thead>
    <tbody class="divide-y divide-default">
      @if (loading()) {
        <tr>
          <td [attr.colspan]="columns().length" class="px-2 py-6 text-center text-muted">
            {{ 'COMMON_LOADING' | translate }}
          </td>
        </tr>
      } @else if (!rows().length) {
        <tr>
          <td [attr.colspan]="columns().length" class="px-2 py-6 text-center text-muted">
            {{ emptyKey() | translate }}
          </td>
        </tr>
      } @else {
        @for (row of rows(); track $index) {
          <ng-container *ngTemplateOutlet="rowTemplate(); context: { $implicit: row, index: $index }" />
        }
      }
    </tbody>
  </table>
</div>
