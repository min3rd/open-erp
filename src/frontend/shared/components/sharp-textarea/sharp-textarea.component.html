<div class="space-y-1">
  @if (label()) {
    <label [for]="id()" class="block text-[11px] font-medium text-ink">
      {{ label() }}
      @if (required()) {
        <span class="text-red-500">*</span>
      }
    </label>
  }
  <textarea
    [id]="id()"
    [rows]="rows()"
    [placeholder]="placeholder()"
    [attr.maxlength]="maxlength() ?? null"
    [disabled]="disabled()"
    [required]="required()"
    [(ngModel)]="value"
    [ngModelOptions]="{ standalone: true }"
    class="w-full px-2.5 py-1.5 text-xs bg-surface border rounded-control text-ink placeholder:text-muted focus:outline-none focus:ring-1 focus:ring-accent transition-colors resize-y"
    [class.border-red-500]="!!error()"
    [class.border-default]="!error()"
    [class.opacity-60]="disabled()"
  ></textarea>
  @if (error()) {
    <p class="text-[11px] text-red-600 dark:text-red-400">{{ error() }}</p>
  }
</div>
