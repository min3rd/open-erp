<form class="space-y-2 text-xs" [formGroup]="form" (ngSubmit)="submit()">
  <p class="font-mono text-[10px] uppercase tracking-wider text-muted">{{ scopeLabel() }}</p>

  <label class="block">
    <span class="mb-0.5 block text-[11px] text-ink">{{ labelKey('name') | translate }}</span>
    <input
      type="text"
      formControlName="name"
      class="w-full rounded-control border border-default bg-surface px-2 py-1 text-xs"
      [class.border-rose-500]="invalid('name')"
    />
  </label>

  <label class="block">
    <span class="mb-0.5 block text-[11px] text-ink">{{ labelKey('registry_host') | translate }}</span>
    <input
      type="text"
      formControlName="registry_host"
      placeholder="registry-1.docker.io"
      class="w-full rounded-control border border-default bg-surface px-2 py-1 font-mono text-xs"
      [class.border-rose-500]="invalid('registry_host')"
    />
  </label>

  <label class="block">
    <span class="mb-0.5 block text-[11px] text-ink">{{ labelKey('username') | translate }}</span>
    <input
      type="text"
      formControlName="username"
      class="w-full rounded-control border border-default bg-surface px-2 py-1 text-xs"
      [class.border-rose-500]="invalid('username')"
    />
  </label>

  <label class="block">
    <span class="mb-0.5 block text-[11px] text-ink">{{ labelKey('secret') | translate }}</span>
    <input
      type="password"
      formControlName="secret"
      autocomplete="new-password"
      class="w-full rounded-control border border-default bg-surface px-2 py-1 text-xs"
      [class.border-rose-500]="invalid('secret')"
    />
  </label>

  @if (errorText()) {
    <p class="text-[11px] text-rose-500">{{ errorText() | translate }}</p>
  }

  <div class="flex items-center justify-end gap-1 pt-1">
    <app-sharp-button type="button" size="sm" variant="ghost" (clicked)="cancelled.emit()">
      {{ 'PLUGIN_ACTION_CANCEL' | translate }}
    </app-sharp-button>
    @if (showTest()) {
      <app-sharp-button type="button" size="sm" variant="secondary" [loading]="testing()" (clicked)="test()">
        {{ 'PLUGIN_CREDENTIAL_TEST' | translate }}
      </app-sharp-button>
    }
    <app-sharp-button type="submit" size="sm" variant="primary" [loading]="saving()">
      {{ 'PLUGIN_ACTION_SAVE' | translate }}
    </app-sharp-button>
  </div>
</form>
