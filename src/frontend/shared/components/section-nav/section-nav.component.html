<nav class="flex flex-col gap-0.5" [attr.aria-label]="titleKey() ? (titleKey() | translate) : null">
  @if (titleKey()) {
    <p class="px-2.5 pb-1 pt-1.5 text-[10px] font-bold uppercase tracking-wider text-neutral-400 dark:text-neutral-500">
      {{ titleKey() | translate }}
    </p>
  }
  @for (item of items(); track item.path) {
    <a
      [routerLink]="item.path"
      routerLinkActive="bg-neutral-100 dark:bg-neutral-800 text-neutral-900 dark:text-neutral-100 font-semibold border-neutral-900 dark:border-neutral-100"
      class="inline-flex min-h-10 lg:min-h-8 items-center border-l-2 border-transparent px-2.5 py-1.5 text-xs text-neutral-600 transition-colors hover:bg-neutral-100 dark:text-neutral-300 dark:hover:bg-neutral-800"
    >
      {{ item.labelKey | translate }}
    </a>
  }
</nav>
