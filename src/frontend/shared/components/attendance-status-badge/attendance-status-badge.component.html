<span class="inline-flex items-center gap-1">
  <span
    class="inline-flex items-center px-1.5 py-0.5 text-[11px] font-mono font-medium rounded-none uppercase tracking-wider border"
    [ngClass]="{
      'bg-success/10 text-success border-success/40': variant() === 'success',
      'bg-warning/10 text-warning border-warning/40': variant() === 'warning',
      'bg-danger/10 text-danger border-danger/40': variant() === 'danger',
      'bg-accent/10 text-accent border-accent/40': variant() === 'info',
      'bg-surface-muted text-muted border-default': variant() === 'default',
      'border-dashed border-amber-500 ring-1 ring-amber-500/30': needsReview()
    }"
  >
    {{ i18nKey() | translate }}
  </span>
  @if (needsReview()) {
    <span
      class="inline-flex items-center text-amber-600 dark:text-amber-400"
      [title]="'attendance.record.needs_review_title' | translate"
      [attr.aria-label]="'attendance.record.needs_review_title' | translate"
    >
      <svg class="w-3 h-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
      </svg>
    </span>
  }
</span>
