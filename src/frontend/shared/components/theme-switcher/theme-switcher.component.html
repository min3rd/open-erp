<div class="grid grid-cols-[7rem_minmax(0,1fr)] items-center gap-x-2 gap-y-1.5 text-[11px] font-mono select-none">
  <!-- Colour theme (per user; AUTO follows the tenant default) -->
  <span class="erp-switcher-label truncate text-muted font-semibold text-[10px] uppercase" [appTranslate]="'THEME_LABEL'"></span>
  <select
    (change)="onThemeChange($event)"
    [attr.aria-label]="'THEME_LABEL' | translate"
    class="w-full min-w-0 border border-default bg-surface text-ink px-1.5 py-0.5 text-[11px] font-mono rounded-inline cursor-pointer max-sm:min-h-10"
  >
    <option [value]="themeAutoValue" [selected]="themeValue() === themeAutoValue">
      {{ 'THEME_FOLLOW_TENANT' | translate }}
    </option>
    @for (item of themes; track item.id) {
      <option [value]="item.id" [selected]="themeValue() === item.id">
        {{ item.nameKey | translate }}
      </option>
    }
  </select>

  <!-- Owner/admin only: promote the applied theme to the tenant default -->
  <span
    *appRequirePermission="themePermission"
    class="erp-switcher-label truncate text-muted font-semibold text-[10px] uppercase"
    [appTranslate]="'THEME_TENANT_DEFAULT'"
  ></span>
  <div *appRequirePermission="themePermission" class="flex min-w-0 items-center gap-1.5">
    <span class="min-w-0 truncate text-ink">{{ tenantThemeNameKey() | translate }}</span>
    <button
      type="button"
      (click)="setTenantDefault()"
      [disabled]="theme.themeId() === theme.tenantTheme()"
      class="ms-auto shrink-0 rounded-inline border border-default px-1.5 py-0.5 text-[10px] text-muted transition-colors hover:bg-surface-muted hover:text-ink disabled:opacity-40 disabled:cursor-default cursor-pointer max-sm:min-h-10"
    >
      {{ 'THEME_SET_TENANT_DEFAULT' | translate }}
    </button>
  </div>

  <!-- Shape / corner scale (per user; AUTO follows the colour theme) -->
  <span class="erp-switcher-label truncate text-muted font-semibold text-[10px] uppercase" [appTranslate]="'SHAPE_LABEL'"></span>
  <select
    (change)="onShapeChange($event)"
    [attr.aria-label]="'SHAPE_LABEL' | translate"
    class="w-full min-w-0 border border-default bg-surface text-ink px-1.5 py-0.5 text-[11px] font-mono rounded-inline cursor-pointer max-sm:min-h-10"
  >
    @for (item of shapes; track item.id) {
      <option [value]="item.id" [selected]="shapeValue() === item.id">
        {{ item.nameKey | translate }}
      </option>
    }
  </select>

  <!-- Menu layout (per user; AUTO follows the colour theme) -->
  <span class="erp-switcher-label truncate text-muted font-semibold text-[10px] uppercase" [appTranslate]="'LAYOUT_LABEL'"></span>
  <select
    (change)="onLayoutChange($event)"
    [attr.aria-label]="'LAYOUT_LABEL' | translate"
    class="w-full min-w-0 border border-default bg-surface text-ink px-1.5 py-0.5 text-[11px] font-mono rounded-inline cursor-pointer max-sm:min-h-10"
  >
    @for (item of layouts; track item.id) {
      <option [value]="item.id" [selected]="layoutValue() === item.id">
        {{ item.nameKey | translate }}
      </option>
    }
  </select>

  <!-- Light/dark mode (always available, per user) -->
  <span class="erp-switcher-label truncate text-muted font-semibold text-[10px] uppercase" [appTranslate]="'COMMON_THEME'"></span>
  <div class="inline-flex justify-self-start border border-default bg-surface-muted rounded-inline overflow-hidden">
    @for (item of modes; track item.mode; let last = $last) {
      <button
        type="button"
        (click)="setMode(item.mode)"
        [attr.aria-pressed]="theme.mode() === item.mode"
        [attr.title]="item.label | translate"
        [class.bg-accent]="theme.mode() === item.mode"
        [class.text-accent-contrast]="theme.mode() === item.mode"
        [class.text-muted]="theme.mode() !== item.mode"
        [class.hover:bg-surface-raised]="theme.mode() !== item.mode"
        class="px-2 py-0.5 text-[11px] font-mono font-medium transition-colors cursor-pointer max-sm:min-h-10 max-sm:min-w-10 max-sm:inline-flex max-sm:items-center max-sm:justify-center"
      >
        {{ item.label | translate }}
      </button>
      @if (!last) {
        <div class="w-[1px] bg-default"></div>
      }
    }
  </div>
</div>
