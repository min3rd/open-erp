<div class="space-y-1">
  @if (label()) {
    <div class="flex justify-between items-center text-[11px] font-medium text-ink">
      <label [for]="id()">
        {{ label() }}
        @if (required()) {
          <span class="text-red-500">*</span>
        }
      </label>
      @if (hint()) {
        <span class="text-muted text-[10px]">{{ hint() }}</span>
      }
    </div>
  }
  <select
    [id]="id()"
    [disabled]="disabled()"
    [required]="required()"
    [(ngModel)]="value"
    [ngModelOptions]="{ standalone: true }"
    class="w-full px-2 py-1.5 text-xs bg-surface border rounded-control text-ink focus:outline-none focus:ring-1 focus:ring-accent transition-colors"
    [class.border-red-500]="!!error()"
    [class.border-default]="!error()"
    [class.opacity-60]="disabled()"
  >
    @for (option of options(); track option.value) {
      <option [value]="option.value" [disabled]="!!option.disabled">
        {{ option.labelKey ? (option.labelKey | translate) : option.label }}
      </option>
    }
  </select>
  @if (error()) {
    <p class="text-[11px] text-red-600 dark:text-red-400">{{ error() }}</p>
  }
</div>
