<div
  class="flex w-full flex-col gap-1 rounded-container border p-2 text-xs shadow-panel transition-colors"
  [class]="selected()
    ? 'border-accent bg-surface-muted'
    : 'border-default bg-surface hover:bg-surface-muted'"
>
  <div class="flex items-start justify-between gap-2">
    <button type="button" class="min-w-0 flex-1 text-left" (click)="onPick()">
      <div class="flex flex-wrap items-center gap-1">
        <span class="truncate text-sm font-medium text-ink">{{ displayName() }}</span>
        <span class="font-mono text-[10px] text-muted">{{ pluginKey() }}</span>
        @if (isCustom()) {
          <app-badge variant="warning">{{ 'PLUGIN_CUSTOM_LABEL_SHORT' | translate }}</app-badge>
        }
        @if (locked()) {
          <app-badge variant="neutral">{{ 'PLUGIN_LOCKED_LABEL' | translate }}</app-badge>
        }
        @if (catalogBlocked()) {
          <app-badge variant="danger">{{ 'PLUGIN_STATUS_BLOCKED' | translate }}</app-badge>
        }
        @if (updateAvailable()) {
          <app-badge variant="info">{{ 'PLUGIN_STATUS_UPDATE_AVAILABLE' | translate }}</app-badge>
        }
      </div>
      @if (descriptionKey()) {
        <p class="mt-0.5 line-clamp-2 text-[11px] text-muted">
          {{ descriptionKey() | translate }}
        </p>
      }
      <div class="mt-1 flex flex-wrap items-center gap-2 text-[11px] text-muted">
        @if (statusKey(); as status) {
          <app-badge [variant]="statusVariant()">{{ status | translate }}</app-badge>
        }
        @if (installedVersion()) {
          <span>{{ 'PLUGIN_VERSION_INSTALLED' | translate }}: <span class="font-mono">{{ installedVersion() }}</span></span>
        }
        @if (latestVersion()) {
          <span>{{ 'PLUGIN_VERSION_LATEST' | translate }}: <span class="font-mono">{{ latestVersion() }}</span></span>
        }
      </div>
    </button>
    <div class="flex shrink-0 items-center gap-1">
      <ng-content></ng-content>
    </div>
  </div>
</div>
