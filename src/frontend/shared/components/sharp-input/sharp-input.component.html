<div class="space-y-1">
  @if (label()) {
    <div class="flex justify-between items-center text-[11px] font-medium text-ink">
      <label [for]="id()">
        {{ label() }}
        @if (required()) {
          <span class="text-red-500">*</span>
        }
      </label>
      @if (hint()) {
        <span class="text-muted text-[10px]">{{ hint() }}</span>
      }
    </div>
  }
  <input
    [id]="id()"
    [type]="type()"
    [placeholder]="placeholder()"
    [disabled]="disabled()"
    [required]="required()"
    [(ngModel)]="value"
    [ngModelOptions]="{ standalone: true }"
    class="h-8 w-full px-2.5 py-1.5 text-xs bg-surface border rounded-control text-ink placeholder:text-muted focus:outline-none focus:ring-1 focus:ring-accent transition-colors"
    [class.border-red-500]="!!error()"
    [class.border-default]="!error()"
    [class.opacity-60]="disabled()"
  />
  @if (error()) {
    <p class="text-[11px] text-red-600 dark:text-red-400">{{ error() }}</p>
  }
</div>
