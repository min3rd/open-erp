<div class="space-y-1">
  @if (label()) {
    <div class="flex justify-between items-center text-[11px] font-medium text-neutral-700 dark:text-neutral-300">
      <label [for]="id()">
        {{ label() }}
        @if (required()) {
          <span class="text-red-500">*</span>
        }
      </label>
      @if (hint()) {
        <span class="text-neutral-400 text-[10px]">{{ hint() }}</span>
      }
    </div>
  }
  <input
    [id]="id()"
    [type]="type()"
    [placeholder]="placeholder()"
    [disabled]="disabled()"
    [required]="required()"
    [(ngModel)]="value"
    class="w-full px-2.5 py-1.5 text-xs bg-white dark:bg-neutral-900 border rounded-none text-neutral-900 dark:text-neutral-100 placeholder-neutral-400 focus:outline-none focus:ring-1 focus:ring-neutral-900 dark:focus:ring-neutral-200 transition-colors"
    [class.border-red-500]="!!error()"
    [class.border-neutral-300]="!error()"
    [class.dark:border-neutral-700]="!error()"
    [class.opacity-60]="disabled()"
  />
  @if (error()) {
    <p class="text-[11px] text-red-600 dark:text-red-400">{{ error() }}</p>
  }
</div>
