<div class="flex items-center gap-2 justify-center">
  @for (digit of digits(); track $index) {
    <input
      #pinBox
      type="text"
      inputmode="numeric"
      pattern="[0-9]*"
      maxlength="1"
      [attr.aria-label]="ariaLabel() || null"
      [disabled]="disabled()"
      [value]="digit"
      (input)="handleInput($event, $index)"
      (keydown)="handleKeyDown($event, $index)"
      (paste)="handlePaste($event)"
      class="w-9 h-10 text-center font-mono text-base font-semibold border rounded-control bg-surface text-ink border-default focus:border-accent focus:ring-1 focus:ring-accent focus:outline-none transition-colors"
      [class.border-red-500]="hasError()"
    />
  }
</div>
