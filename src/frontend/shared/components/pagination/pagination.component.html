<div class="flex flex-wrap items-center justify-between gap-2 border border-t-0 border-default bg-surface-muted px-2 py-1.5 text-[11px] text-muted">
  <span>{{ 'COMMON_TOTAL_ITEMS' | translate:{ total: totalItems() } }}</span>
  <div class="flex items-center gap-1">
    <button
      type="button"
      class="px-2 py-0.5 border border-default rounded-control disabled:opacity-40 disabled:cursor-not-allowed hover:bg-surface-muted"
      [disabled]="!canPrev()"
      (click)="prev()"
    >
      {{ 'COMMON_PREV' | translate }}
    </button>
    <span class="font-mono px-1">{{ 'COMMON_PAGE_OF' | translate:{ page: displayPage(), total_pages: totalPages() || 1 } }}</span>
    <button
      type="button"
      class="px-2 py-0.5 border border-default rounded-control disabled:opacity-40 disabled:cursor-not-allowed hover:bg-surface-muted"
      [disabled]="!canNext()"
      (click)="next()"
    >
      {{ 'COMMON_NEXT_PAGE' | translate }}
    </button>
  </div>
</div>
