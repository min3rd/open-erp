<div class="flex flex-wrap items-center justify-between gap-2 border border-t-0 border-default bg-surface-muted px-2 py-1.5 text-[11px] text-muted">
  <div class="flex flex-wrap items-center gap-2">
    <span>{{ 'COMMON_TOTAL_ITEMS' | translate:{ total: totalItems() } }}</span>
    <label class="flex items-center gap-1">
      <span>{{ 'COMMON_PAGE_SIZE' | translate }}</span>
      <select
        class="min-h-10 min-w-10 border border-default bg-surface px-1 py-0.5 text-[11px]"
        [value]="size()"
        [attr.aria-label]="'COMMON_PAGE_SIZE' | translate"
        (change)="changePageSize($event)"
      >
        @for (option of pageSizeOptions(); track option) {
          <option [value]="option" [selected]="option === size()">{{ option }}</option>
        }
      </select>
    </label>
  </div>
  <div class="flex items-center gap-1">
    <button
      type="button"
      class="min-h-10 min-w-10 px-2 py-0.5 border border-default rounded-inline disabled:opacity-40 disabled:cursor-not-allowed hover:bg-surface-muted"
      [disabled]="!canPrev()"
      (click)="prev()"
    >
      {{ 'COMMON_PREV' | translate }}
    </button>
    <span class="font-mono px-1">{{ 'COMMON_PAGE_OF' | translate:{ page: displayPage(), total_pages: totalPages() || 1 } }}</span>
    <button
      type="button"
      class="min-h-10 min-w-10 px-2 py-0.5 border border-default rounded-inline disabled:opacity-40 disabled:cursor-not-allowed hover:bg-surface-muted"
      [disabled]="!canNext()"
      (click)="next()"
    >
      {{ 'COMMON_NEXT_PAGE' | translate }}
    </button>
  </div>
</div>
