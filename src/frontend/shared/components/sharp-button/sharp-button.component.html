<button
  [type]="type()"
  [disabled]="disabled() || loading()"
  (click)="onClick($event)"
  [class]="buttonClasses()"
>
  @if (loading()) {
    <!-- Shared icon set (AC-07/AC-08): no hand-written <svg> outside app-icon. -->
    <app-icon name="loader" [decorative]="true" class="me-2 -ms-1 h-3.5 w-3.5 animate-spin" />
  }
  <ng-content></ng-content>
</button>
