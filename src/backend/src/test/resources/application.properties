# Test Environment Configuration (Real PostgreSQL 16+ - NO H2)
# IMPORTANT: use a DEDICATED test database so tests never wipe local dev data.
# The database is auto-created by scripts/dev/start_infra.* (or docker/postgres/init on fresh volumes).
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/openerp_test
quarkus.datasource.username=openerp
quarkus.datasource.password=openerp_dev_password

# Flyway & ORM
quarkus.hibernate-orm.database.generation=none
quarkus.flyway.migrate-at-start=true
quarkus.flyway.baseline-on-migrate=true
quarkus.flyway.schemas=public

# Mock Mailer
quarkus.mailer.mock=true

# JWT Test Mock
mp.jwt.verify.issuer=https://openerp.9ms.io.vn/auth
smallrye.jwt.new-token.issuer=https://openerp.9ms.io.vn/auth
smallrye.jwt.new-token.lifespan=900

quarkus.log.level=WARN
quarkus.log.category."com.vn9melody.openerp".level=INFO

# Frontend URL
openerp.frontend.url=http://localhost:4200

# Redis (real instance - dedicated test database index /1 to keep tests isolated)
quarkus.redis.hosts=redis://:openerp_redis_password@localhost:6379/1


