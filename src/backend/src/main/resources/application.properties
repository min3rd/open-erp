# Open-ERP Quarkus Application Configuration
quarkus.application.name=openerp-backend
quarkus.http.port=8088

# 1. Datasource (PostgreSQL 16+)
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/openerp_dev
quarkus.datasource.username=openerp
quarkus.datasource.password=openerp_dev_password
quarkus.datasource.jdbc.max-size=16
quarkus.datasource.jdbc.min-size=2

# 2. Hibernate ORM & Flyway
quarkus.hibernate-orm.database.generation=none
quarkus.flyway.migrate-at-start=true
quarkus.flyway.baseline-on-migrate=true
quarkus.flyway.schemas=public

# 3. Security & JWT
mp.jwt.verify.issuer=https://openerp.9ms.io.vn/auth
mp.jwt.verify.publickey.location=publicKey.pem
smallrye.jwt.sign.key.location=privateKey.pem
smallrye.jwt.new-token.issuer=https://openerp.9ms.io.vn/auth
smallrye.jwt.new-token.lifespan=900

# 4. Mailer (Mailpit SMTP)
quarkus.mailer.host=localhost
quarkus.mailer.port=1025
quarkus.mailer.from=noreply@openerp.9ms.io.vn
quarkus.mailer.mock=false

# 5. OpenAPI & Swagger UI
quarkus.smallrye-openapi.path=/q/openapi
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/q/swagger-ui

# 6. Logging
quarkus.log.level=INFO
quarkus.log.category."com.vn9melody.openerp".level=DEBUG
quarkus.log.console.format=%d{yyyy-MM-dd HH:mm:ss,SSS} %-5p [%c{3.}] (%t) %s%e%n

# 7. Frontend Integration & Domain URL
openerp.frontend.url=http://localhost:4200
%prod.openerp.frontend.url=https://openerp.9ms.io.vn
%staging.openerp.frontend.url=https://staging.openerp.9ms.io.vn

