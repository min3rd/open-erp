# Open-ERP Quarkus Application Configuration
quarkus.application.name=openerp-backend
quarkus.http.port=8088

# 1. Datasource (PostgreSQL 16+)
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/openerp_dev
quarkus.datasource.username=openerp
quarkus.datasource.password=openerp_dev_password
quarkus.datasource.jdbc.max-size=16
quarkus.datasource.jdbc.min-size=2

# 2. Hibernate ORM & Flyway
quarkus.hibernate-orm.database.generation=none
quarkus.flyway.migrate-at-start=true
quarkus.flyway.baseline-on-migrate=true
quarkus.flyway.schemas=public

# 3. Security & JWT
# Lazy authentication: public auth endpoints (login/register/...) must not be rejected by the
# security layer when a stale/expired Bearer token is still stored in the browser.
# Protected endpoints enforce auth via AccessTokenVerifier (JSON error envelope, BUG-34).
quarkus.http.auth.proactive=false
mp.jwt.verify.issuer=https://openerp.9ms.io.vn/auth
mp.jwt.verify.publickey.location=publicKey.pem
smallrye.jwt.sign.key.location=privateKey.pem
smallrye.jwt.new-token.issuer=https://openerp.9ms.io.vn/auth
smallrye.jwt.new-token.lifespan=900
# Staging/Production must mount dedicated key pairs (never reuse the dev keys).
%prod.mp.jwt.verify.publickey.location=${OPENERP_JWT_PUBLIC_KEY:/deploy/secrets/jwt/publicKey.pem}
%prod.smallrye.jwt.sign.key.location=${OPENERP_JWT_PRIVATE_KEY:/deploy/secrets/jwt/privateKey.pem}
%staging.mp.jwt.verify.publickey.location=${OPENERP_JWT_PUBLIC_KEY:/deploy/secrets/jwt/publicKey.pem}
%staging.smallrye.jwt.sign.key.location=${OPENERP_JWT_PRIVATE_KEY:/deploy/secrets/jwt/privateKey.pem}

# 4. Mailer (Mailpit SMTP)
quarkus.mailer.host=localhost
quarkus.mailer.port=1025
quarkus.mailer.from=noreply@openerp.9ms.io.vn
quarkus.mailer.mock=false

# 5. OpenAPI & Swagger UI
quarkus.smallrye-openapi.path=/q/openapi
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/q/swagger-ui

# 5b. Jackson (BUG-79): every java.time value (Instant) serializes as an ISO-8601
# UTC string with the 'Z' suffix — never an epoch number. The frontend converts to
# the browser timezone/locale.
quarkus.jackson.write-dates-as-timestamps=false

# 6. Logging
quarkus.log.level=INFO
quarkus.log.category."com.vn9melody.openerp".level=DEBUG
quarkus.log.console.format=%d{yyyy-MM-dd HH:mm:ss,SSS} %-5p [%c{3.}] (%t) %s%e%n

# 7. Frontend Integration, CORS & Domain URL
# Cho phép Web dev (4200) và Mobile dev (8100) gọi API trực tiếp khi QA manual test local
quarkus.http.cors=true
quarkus.http.cors.origins=http://localhost:4200,http://localhost:8100,http://localhost:8101
quarkus.http.cors.methods=GET,POST,PUT,DELETE,PATCH,OPTIONS
quarkus.http.cors.headers=accept,authorization,content-type,x-session-id
quarkus.http.cors.exposed-headers=content-type
openerp.frontend.url=http://localhost:4200
%prod.openerp.frontend.url=https://openerp.9ms.io.vn
%staging.openerp.frontend.url=https://staging.openerp.9ms.io.vn
%prod.quarkus.http.cors.origins=${OPENERP_CORS_ORIGINS:https://openerp.9ms.io.vn,https://www.openerp.9ms.io.vn}
%staging.quarkus.http.cors.origins=${OPENERP_CORS_ORIGINS:https://staging.openerp.9ms.io.vn}

# 8. Redis (Session Store, OTP, Brute-Force, Blacklist)
quarkus.redis.hosts=redis://:openerp_redis_password@localhost:6379

# 9. Security - AES-256-GCM key for TOTP secret encryption
# WARNING: This is a DEV-ONLY key. Staging/Production MUST override it via the
# OPENERP_SECURITY_AES_KEY environment variable (Base64 of exactly 32 bytes).
openerp.security.aes-key=spsYbukuiz0ro2Wc9Wmw19M6nzHhjTD+wttnjybGl/I=
%prod.openerp.security.aes-key=${OPENERP_SECURITY_AES_KEY}
%staging.openerp.security.aes-key=${OPENERP_SECURITY_AES_KEY}

# 10. HTTP Proxy (resolve real client IP behind reverse proxy)
# Note: expose your proxy CIDRs via quarkus.http.proxy.trusted-proxies in staging/prod.
quarkus.http.proxy.proxy-address-forwarding=true
quarkus.http.proxy.allow-x-forwarded=true

# 11. Account APIs require a valid Bearer access token, enforced by AccessTokenVerifier at
# the JAX-RS layer so that 401 responses always carry the JSON error envelope (BUG-34).

# 12. Platform Super Admin (bootstrap, impersonation, audit chain, tenant lifecycle)
# Bootstrap only runs when no ACTIVE SUPER_ADMIN exists; the secret is read from the
# OPENERP_ADMIN_BOOTSTRAP_SECRET environment variable (never hardcode real values).
openerp.platform.impersonation-ttl-seconds=1800
openerp.platform.deletion-grace-days=30
openerp.platform.audit.retention-months=24
openerp.platform.audit.partition-interval-seconds=86400
openerp.platform.audit.retention-interval-seconds=2592000
openerp.platform.audit.jobs-enabled=true
openerp.platform.lifecycle.jobs-enabled=true
openerp.platform.lifecycle.interval-seconds=86400
# BUG-78: sweeper for abandoned impersonation sessions (overdue STARTED -> TIMEOUT).
openerp.platform.impersonation.jobs-enabled=true
openerp.platform.impersonation.interval-seconds=300

# 13. Platform Plugin Catalog (FEAT-20, GET /api/v1/platform/plugins)
# Extra plugins appended after the mandatory `core` entry so ops can extend the catalog
# without a code change. CSV entries, each `key[:name_key[:description_key]]`:
#   sales:PLUGIN_SALES_NAME:PLUGIN_SALES_DESCRIPTION  -> explicit i18n keys (recommended)
#   inventory                                         -> derived keys PLUGIN_INVENTORY_NAME / PLUGIN_INVENTORY_DESCRIPTION
#   billing:PLUGIN_BILLING_NAME                       -> description key derived
# Keys are deduped case-insensitively; `core` in this list is ignored (always mandatory).
# Leave empty to expose only `core`.
openerp.platform.plugin-catalog=

# Tests: background timers disabled (jobs are invoked directly) and the engine audit
# bridge is off so shared-suite fixtures can delete users without audit FK conflicts.
%test.openerp.platform.audit.jobs-enabled=false
%test.openerp.platform.lifecycle.jobs-enabled=false
%test.openerp.platform.impersonation.jobs-enabled=false
%test.openerp.platform.audit.recorder-enabled=false

