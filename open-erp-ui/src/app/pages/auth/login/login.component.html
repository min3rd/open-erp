<div class="min-h-screen flex flex-col justify-center py-12 sm:px-6 lg:px-8 bg-slate-900 relative overflow-hidden font-sans" *transloco="let t">

  <!-- Background Glowing Orbs -->
  <div class="absolute -top-40 -left-40 w-96 h-96 bg-indigo-600/30 rounded-full blur-3xl pointer-events-none"></div>
  <div class="absolute -bottom-40 -right-40 w-96 h-96 bg-cyan-600/20 rounded-full blur-3xl pointer-events-none"></div>

  <!-- Header Switchers (Lang & Theme) -->
  <div class="absolute top-6 right-6 flex items-center gap-3 z-10">
    <button (click)="langService.toggleLanguage()"
            class="px-3 py-1.5 rounded-xl border border-slate-700 bg-slate-800/80 hover:bg-slate-700 text-white text-xs font-medium transition-colors flex items-center gap-2">
      <span>{{ langService.currentLanguage() === 'vi' ? '🇻🇳 VN' : '🇺🇸 EN' }}</span>
    </button>
  </div>

  <div class="sm:mx-auto sm:w-full sm:max-w-md relative z-10">
    <!-- Brand Logo -->
    <div class="flex justify-center">
      <div class="w-14 h-14 rounded-2xl bg-gradient-to-tr from-indigo-500 via-indigo-600 to-cyan-400 flex items-center justify-center text-white font-black text-2xl shadow-xl shadow-indigo-500/25">
        OE
      </div>
    </div>
    <h2 class="mt-4 text-center text-2xl font-bold tracking-tight text-white">
      {{ t('auth.loginTitle') }}
    </h2>
    <p class="mt-1 text-center text-xs text-slate-400">
      {{ t('auth.loginSubtitle') }}
    </p>
  </div>

  <div class="mt-8 sm:mx-auto sm:w-full sm:max-w-md px-4 sm:px-0 relative z-10">
    <div class="bg-slate-800/90 backdrop-blur-xl border border-slate-700/80 py-8 px-6 shadow-2xl rounded-3xl sm:px-10">
      
      @if (errorMessage()) {
        <div class="mb-5 p-3.5 rounded-xl bg-rose-500/10 border border-rose-500/30 text-rose-300 text-xs flex items-center gap-2.5">
          <svg class="w-4 h-4 shrink-0 text-rose-400" fill="currentColor" viewBox="0 0 20 20">
            <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clip-rule="evenodd"/>
          </svg>
          <span>{{ errorMessage() }}</span>
        </div>
      }

      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="space-y-4">
        
        <!-- Tenant ID -->
        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1.5">
            {{ t('auth.tenant') }}
          </label>
          <input type="text" formControlName="tenantId"
                 [placeholder]="t('auth.tenantPlaceholder')"
                 class="w-full px-3.5 py-2.5 rounded-xl bg-slate-900/90 border border-slate-700 text-slate-100 text-xs placeholder-slate-500 focus:ring-2 focus:ring-indigo-500 focus:border-transparent outline-none transition-all"/>
        </div>

        <!-- Username -->
        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1.5">
            {{ t('auth.username') }}
          </label>
          <input type="text" formControlName="username"
                 [placeholder]="t('auth.usernamePlaceholder')"
                 class="w-full px-3.5 py-2.5 rounded-xl bg-slate-900/90 border border-slate-700 text-slate-100 text-xs placeholder-slate-500 focus:ring-2 focus:ring-indigo-500 focus:border-transparent outline-none transition-all"/>
        </div>

        <!-- Password -->
        <div>
          <div class="flex items-center justify-between mb-1.5">
            <label class="text-xs font-semibold text-slate-300">
              {{ t('auth.password') }}
            </label>
            <a href="javascript:void(0)" class="text-[11px] text-indigo-400 hover:text-indigo-300">
              {{ t('auth.forgotPassword') }}
            </a>
          </div>
          <input type="password" formControlName="password"
                 [placeholder]="t('auth.passwordPlaceholder')"
                 class="w-full px-3.5 py-2.5 rounded-xl bg-slate-900/90 border border-slate-700 text-slate-100 text-xs placeholder-slate-500 focus:ring-2 focus:ring-indigo-500 focus:border-transparent outline-none transition-all"/>
        </div>

        <!-- Submit Button -->
        <div class="pt-2">
          <button type="submit" [disabled]="isLoading()"
                  class="w-full py-3 px-4 rounded-xl bg-gradient-to-r from-indigo-500 to-indigo-600 hover:from-indigo-600 hover:to-indigo-700 text-white text-xs font-bold shadow-lg shadow-indigo-500/25 transition-all flex items-center justify-center gap-2 cursor-pointer disabled:opacity-50">
            @if (isLoading()) {
              <svg class="animate-spin h-4 w-4 text-white" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path>
              </svg>
              <span>{{ t('auth.loggingIn') }}</span>
            } @else {
              <span>{{ t('auth.loginBtn') }}</span>
            }
          </button>
        </div>
      </form>

      <!-- System Footnote -->
      <div class="mt-6 text-center">
        <p class="text-[11px] text-slate-500">
          {{ t('auth.poweredBy') }}
        </p>
      </div>

    </div>
  </div>
</div>
