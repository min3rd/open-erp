quarkus.http.port=8080
quarkus.smallrye-health.root-path=/q/health

# Shared plugin SDK: index providers/filters/mappers from the dependency JAR.
quarkus.index-dependency.plugin-sdk.group-id=com.vn9melody.openerp.plugins
quarkus.index-dependency.plugin-sdk.artifact-id=plugin-sdk

plugin.key=${PLUGIN_KEY:workflow}
plugin.scope=${PLUGIN_SCOPE:tenant}

# Core internal HTTP (event publish + entity write proxy, Sprint 08).
plugin.core.internal-url=${PLUGIN_CORE_INTERNAL_URL:http://backend-dev:8088}

# Plugin Data Gateway (core-owned schema and query execution).
plugin.data.gateway-url=${PLUGIN_DATA_GATEWAY_URL:}
plugin.data.service-token=${PLUGIN_SERVICE_TOKEN:}
plugin.data.tls-ca=${PLUGIN_DATA_TLS_CA:}
plugin.data.tls-cert=${PLUGIN_DATA_TLS_CERT:}
plugin.data.tls-key=${PLUGIN_DATA_TLS_KEY:}
plugin.data.deadline-ms=${PLUGIN_DATA_DEADLINE_MS:15000}

quarkus.redis.hosts=${QUARKUS_REDIS_HOSTS:redis://localhost:6379}

# SLA scan cadence (ADR-S08-001: reminders are non-interrupting, overdue still actionable).
workflow.sla.scan-interval-seconds=${WORKFLOW_SLA_SCAN_SECONDS:60}
