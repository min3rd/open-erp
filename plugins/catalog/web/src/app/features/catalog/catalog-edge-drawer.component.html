<app-drawer
  [isOpen]="isOpen()"
  [title]="'CATALOG_EDGE_FORM_TITLE' | translate"
  [subtitle]="child()?.name ?? ''"
  [width]="'w-screen max-w-md'"
  [zIndex]="70"
  [shiftLeft]="true"
  (close)="close.emit()"
>
  <div class="space-y-3">
    @if (errorText()) {
      <div class="border border-red-300 dark:border-red-800 bg-red-50 dark:bg-red-950/40 px-2 py-1.5 text-[11px] text-red-700 dark:text-red-300" role="alert">
        {{ errorText() }}
      </div>
    }

    @if (parentTypeOptions().length > 1) {
      <app-sharp-select
        [label]="'CATALOG_EDGE_FIELD_PARENT_TYPE' | translate"
        [options]="parentTypeOptions()"
        [value]="parentTypeCode()"
        (valueChange)="parentTypeCode.set($event); parentRef.set(null)"
      />
    }

    <div class="space-y-1">
      <p class="text-[11px] font-medium">{{ 'CATALOG_EDGE_FIELD_PARENT' | translate }}</p>
      <app-catalog-picker
        [typeCode]="parentTypeCode()"
        [mode]="'single'"
        [placeholderKey]="'CATALOG_EDGE_SELECT_PARENT'"
        (selectionChange)="onParentSelected($event)"
      />
    </div>

    <div class="grid grid-cols-2 gap-2">
      <app-sharp-select
        [label]="'CATALOG_EDGE_FIELD_RELATION_TYPE' | translate"
        [options]="relationOptions()"
        [value]="relationType()"
        (valueChange)="relationType.set($any($event))"
      />
      <app-sharp-input
        [label]="'CATALOG_EDGE_FIELD_SORT_ORDER' | translate"
        type="number"
        [value]="sortOrder()"
        (valueChange)="sortOrder.set($event)"
      />
    </div>
  </div>

  <div drawer-footer class="flex items-center gap-2">
    <app-sharp-button variant="secondary" size="sm" (clicked)="close.emit()">
      {{ 'COMMON_CANCEL' | translate }}
    </app-sharp-button>
    <app-sharp-button size="sm" [loading]="saving()" (clicked)="save()">
      {{ 'CATALOG_DETAIL_ADD_PARENT' | translate }}
    </app-sharp-button>
  </div>
</app-drawer>
