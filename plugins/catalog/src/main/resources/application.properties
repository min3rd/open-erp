quarkus.http.port=8080
quarkus.smallrye-health.root-path=/q/health

# Plugin-declared migration location (build-time). Core supplies the target schema.
quarkus.flyway.locations=classpath:db/plugin-migration

# Shared plugin SDK: index providers/filters/mappers from the dependency JAR.
quarkus.index-dependency.plugin-sdk.group-id=com.vn9melody.openerp.plugins
quarkus.index-dependency.plugin-sdk.artifact-id=plugin-sdk

# Tenant header contract set by the core runtime gateway.
plugin.key=${PLUGIN_KEY:catalog}
plugin.scope=${PLUGIN_SCOPE:tenant}
plugin.tenant-id=${TENANT_ID:}
catalog.import.max-rows=${CATALOG_IMPORT_MAX_ROWS:20000}

# Plugin Data Gateway (SOL-S05-002). Empty URL disables data access until the
# core deployer injects it; mTLS files are required for https URLs.
plugin.data.gateway-url=${PLUGIN_DATA_GATEWAY_URL:}
plugin.data.service-token=${PLUGIN_SERVICE_TOKEN:}
plugin.data.tls-ca=${PLUGIN_DATA_TLS_CA:}
plugin.data.tls-cert=${PLUGIN_DATA_TLS_CERT:}
plugin.data.tls-key=${PLUGIN_DATA_TLS_KEY:}
plugin.data.deadline-ms=${PLUGIN_DATA_DEADLINE_MS:3000}

# Plugin-owned read cache. Namespace and invalidation live in the plugin.
quarkus.redis.hosts=${QUARKUS_REDIS_HOSTS:redis://localhost:6379}
catalog.cache.enabled=${CATALOG_CACHE_ENABLED:true}
catalog.cache.ttl-seconds=${CATALOG_CACHE_TTL_SECONDS:60}
