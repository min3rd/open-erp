quarkus.http.port=8080
quarkus.smallrye-health.root-path=/q/health

# Plugin-declared migration location (build-time). Core supplies the target schema.
quarkus.flyway.locations=classpath:db/plugin-migration

# Shared plugin SDK: index providers/filters/mappers from the dependency JAR.
quarkus.index-dependency.plugin-sdk.group-id=com.vn9melody.openerp.plugins
quarkus.index-dependency.plugin-sdk.artifact-id=plugin-sdk

# Tenant header contract set by the core runtime gateway.
plugin.scope=${PLUGIN_SCOPE:tenant}
plugin.tenant-id=${TENANT_ID:}
catalog.import.max-rows=${CATALOG_IMPORT_MAX_ROWS:20000}
