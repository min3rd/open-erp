quarkus.http.port=8080
quarkus.smallrye-health.root-path=/q/health

# Shared plugin SDK: index providers/filters/mappers from the dependency JAR.
quarkus.index-dependency.plugin-sdk.group-id=com.vn9melody.openerp.plugins
quarkus.index-dependency.plugin-sdk.artifact-id=plugin-sdk

plugin.key=${PLUGIN_KEY:employee}
plugin.scope=${PLUGIN_SCOPE:tenant}

# Onboarding + documents (TASK-433/434).
employee.onboarding.expiry-hours=${EMPLOYEE_ONBOARDING_EXPIRY_HOURS:168}
employee.document.storage-dir=${EMPLOYEE_DOCUMENT_STORAGE_DIR:}
employee.document.max-bytes=${EMPLOYEE_DOCUMENT_MAX_BYTES:10485760}
# Core REST base for offboarding governance; must be set in every deployment.
openerp.core.url=${OPENERP_CORE_URL:}
# Core internal HTTP for the workflow engine client (Sprint 08, ADR-S08-004).
plugin.core.internal-url=${OPENERP_CORE_URL:http://backend-dev:8080}
# Config-driven frontend link; never hardcode URLs in Java.
openerp.frontend.url=${OPENERP_FRONTEND_URL:https://openerp.9ms.io.vn}

# Plugin Data Gateway (core-owned schema and query execution).
plugin.data.gateway-url=${PLUGIN_DATA_GATEWAY_URL:}
plugin.data.service-token=${PLUGIN_SERVICE_TOKEN:}
plugin.data.tls-ca=${PLUGIN_DATA_TLS_CA:}
plugin.data.tls-cert=${PLUGIN_DATA_TLS_CERT:}
plugin.data.tls-key=${PLUGIN_DATA_TLS_KEY:}
plugin.data.deadline-ms=${PLUGIN_DATA_DEADLINE_MS:15000}
