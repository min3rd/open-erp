<ion-content [fullscreen]="true" class="bg-slate-900 font-sans" *transloco="let t">
  <div class="min-h-screen flex flex-col justify-between p-6 relative overflow-hidden bg-slate-900 text-slate-100">
    
    <!-- Ambient Lighting Effect -->
    <div class="absolute -top-32 -left-32 w-80 h-80 bg-indigo-600/30 rounded-full blur-3xl pointer-events-none"></div>
    <div class="absolute -bottom-32 -right-32 w-80 h-80 bg-cyan-600/20 rounded-full blur-3xl pointer-events-none"></div>

    <!-- Header Switcher -->
    <div class="flex items-center justify-between z-10 pt-4">
      <div class="flex items-center gap-2">
        <div class="w-8 h-8 rounded-xl bg-gradient-to-tr from-indigo-500 to-cyan-400 flex items-center justify-center text-white font-black text-sm shadow-md">
          OE
        </div>
        <span class="font-bold text-sm tracking-tight text-white">OPEN ERP MOBILE</span>
      </div>

      <button (click)="langService.toggleLanguage()"
              class="px-2.5 py-1 rounded-xl border border-slate-700 bg-slate-800/80 text-xs font-semibold text-white">
        {{ langService.currentLanguage() === 'vi' ? '🇻🇳 VN' : '🇺🇸 EN' }}
      </button>
    </div>

    <!-- Login Card Body -->
    <div class="my-auto z-10 py-6">
      <div class="mb-6 text-center">
        <h1 class="text-2xl font-black text-white tracking-tight">{{ t('auth.loginTitle') }}</h1>
        <p class="text-xs text-slate-400 mt-1">{{ t('auth.loginSubtitle') }}</p>
      </div>

      <div class="bg-slate-800/90 backdrop-blur-xl border border-slate-700/80 p-6 rounded-3xl shadow-2xl">
        
        @if (errorMessage()) {
          <div class="mb-4 p-3 rounded-xl bg-rose-500/10 border border-rose-500/30 text-rose-300 text-xs">
            {{ errorMessage() }}
          </div>
        }

        <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="space-y-3.5">
          
          <!-- Tenant ID -->
          <div>
            <label class="block text-[11px] font-semibold text-slate-300 mb-1">{{ t('auth.tenant') }}</label>
            <input type="text" formControlName="tenantId"
                   [placeholder]="t('auth.tenantPlaceholder')"
                   class="w-full px-3.5 py-2.5 rounded-xl bg-slate-900 border border-slate-700 text-xs text-white placeholder-slate-500 focus:ring-2 focus:ring-indigo-500 outline-none"/>
          </div>

          <!-- Username -->
          <div>
            <label class="block text-[11px] font-semibold text-slate-300 mb-1">{{ t('auth.username') }}</label>
            <input type="text" formControlName="username"
                   [placeholder]="t('auth.usernamePlaceholder')"
                   class="w-full px-3.5 py-2.5 rounded-xl bg-slate-900 border border-slate-700 text-xs text-white placeholder-slate-500 focus:ring-2 focus:ring-indigo-500 outline-none"/>
          </div>

          <!-- Password -->
          <div>
            <div class="flex items-center justify-between mb-1">
              <label class="text-[11px] font-semibold text-slate-300">{{ t('auth.password') }}</label>
              <a href="javascript:void(0)" class="text-[10px] text-indigo-400">{{ t('auth.forgotPassword') }}</a>
            </div>
            <input type="password" formControlName="password"
                   [placeholder]="t('auth.passwordPlaceholder')"
                   class="w-full px-3.5 py-2.5 rounded-xl bg-slate-900 border border-slate-700 text-xs text-white placeholder-slate-500 focus:ring-2 focus:ring-indigo-500 outline-none"/>
          </div>

          <!-- Submit Button -->
          <div class="pt-2">
            <button type="submit" [disabled]="isLoading()"
                    class="w-full py-3 px-4 rounded-xl bg-gradient-to-r from-indigo-500 to-indigo-600 active:opacity-90 text-white text-xs font-bold shadow-lg shadow-indigo-500/25 flex items-center justify-center gap-2 cursor-pointer disabled:opacity-50">
              @if (isLoading()) {
                <ion-spinner name="crescent" color="light" class="w-4 h-4"></ion-spinner>
                <span>{{ t('auth.loggingIn') }}</span>
              } @else {
                <span>{{ t('auth.loginBtn') }}</span>
              }
            </button>
          </div>

        </form>
      </div>
    </div>

    <!-- Footer -->
    <div class="text-center z-10 pb-4">
      <p class="text-[10px] text-slate-500">{{ t('auth.poweredBy') }}</p>
    </div>

  </div>
</ion-content>
