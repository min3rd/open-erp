<ion-header [translucent]="true">
  <ion-toolbar class="px-4">
    <div class="flex items-center justify-between">
      <h1 class="text-base font-bold text-slate-900 dark:text-white" *transloco="let t">{{ t('nav.users') }}</h1>
      <button class="w-8 h-8 rounded-xl bg-indigo-600 text-white flex items-center justify-center shadow-sm">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
        </svg>
      </button>
    </div>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="bg-slate-50 dark:bg-slate-950" *transloco="let t">
  <div class="p-4 space-y-4 font-sans pb-16">
    
    <!-- Search Bar -->
    <div class="relative">
      <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
        </svg>
      </div>
      <input type="text" [ngModel]="searchQuery()" (ngModelChange)="searchQuery.set($event)"
             [placeholder]="t('users.searchPlaceholder')"
             class="w-full pl-9 pr-4 py-2.5 text-xs bg-white dark:bg-slate-900 border border-slate-200/80 dark:border-slate-800 rounded-2xl text-slate-900 dark:text-slate-100 placeholder-slate-400 focus:ring-2 focus:ring-indigo-500 outline-none"/>
    </div>

    <!-- Users List Cards -->
    <div class="space-y-3">
      @for (user of filteredUsers(); track user.id) {
        <div class="p-4 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200/80 dark:border-slate-800 shadow-xs flex items-center gap-3">
          <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-500 to-cyan-500 text-white font-bold flex items-center justify-center text-xs shrink-0 shadow-xs">
            {{ user.username[0].toUpperCase() }}
          </div>
          <div class="flex-1 min-w-0">
            <div class="flex items-center justify-between">
              <h3 class="text-xs font-bold text-slate-900 dark:text-white truncate">{{ user.fullName }}</h3>
              <span class="text-[9px] px-2 py-0.5 rounded-full font-bold"
                    [class.bg-emerald-100]="user.status === 'ACTIVE'"
                    [class.text-emerald-700]="user.status === 'ACTIVE'"
                    [class.dark:bg-emerald-950]="user.status === 'ACTIVE'"
                    [class.dark:text-emerald-300]="user.status === 'ACTIVE'"
                    [class.bg-rose-100]="user.status === 'INACTIVE'"
                    [class.text-rose-700]="user.status === 'INACTIVE'">
                {{ user.status === 'ACTIVE' ? t('common.active') : t('common.inactive') }}
              </span>
            </div>
            <p class="text-[11px] text-slate-500 dark:text-slate-400 truncate mt-0.5">{{ user.department }}</p>
            <div class="flex items-center gap-2 mt-1">
              <span class="text-[10px] text-indigo-600 dark:text-indigo-400 font-bold">&#64;{{ user.username }}</span>
              <span class="text-[10px] text-slate-400">• {{ user.email }}</span>
            </div>
          </div>
        </div>
      }
    </div>

  </div>
</ion-content>
